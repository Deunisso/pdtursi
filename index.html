<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WMS - Leitor Ultra Rápido HU (1789)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { width: 100%; height: 100vh; overflow: hidden; background: #0b0b10; color: #fff; }
    
    .app-container { display: flex; flex-direction: column; height: 100vh; padding: 8px; gap: 8px; justify-content: space-between; }

    /* Dashboard Slim */
    #dashboard { display: flex; justify-content: space-between; gap: 8px; height: 55px; flex-shrink: 0; }
    .card { background: #161622; border-radius: 8px; flex: 1; padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-bottom: 3px solid #333; }
    .card.found { border-color: #00e676; }
    .card.missing { border-color: #ff5252; }
    .card p { font-size: 10px; color: #aaa; text-transform: uppercase; font-weight: bold; }
    .card h2 { font-size: 20px; margin-top: 2px; }
    .found h2 { color: #00e676; }
    .missing h2 { color: #ff5252; }

    /* Câmera Central */
    #video-container { position: relative; flex: 1; border-radius: 12px; overflow: hidden; border: 2px solid #2a2a3a; background: #000; display: flex; align-items: center; justify-content: center; min-height: 200px; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* Botão Flutuante de Lanterna */
    #btn-lanterna { position: absolute; top: 10px; right: 10px; z-index: 50; background: rgba(22, 22, 34, 0.85); border: 1px solid #00d2ff; color: #00d2ff; padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; backdrop-filter: blur(4px); display: flex; align-items: center; gap: 4px; }
    #btn-lanterna.ativo { background: #00d2ff; color: #000; box-shadow: 0 0 10px #00d2ff; }

    /* Mira Adaptativa */
    .mira { position: absolute; top: 28%; left: 4%; width: 92%; height: 38%; border: 2px dashed #00d2ff; box-shadow: 0 0 0 999px rgba(0,0,0,0.65); border-radius: 8px; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 6px 10px; transition: all 0.2s ease; }
    .mira.lendo { border-color: #ffd700; }
    .mira.sucesso { border-color: #00e676; background: rgba(0, 230, 118, 0.18); box-shadow: 0 0 0 999px rgba(0,0,0,0.65), 0 0 25px #00e676; }

    /* Visor Interno de Leitura */
    .visor-topo { display: flex; justify-content: space-between; font-size: 9px; color: #00d2ff; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.9); }
    .visor-numeros { font-family: 'Courier New', monospace; font-size: 16px; font-weight: 900; color: #00e676; text-align: center; letter-spacing: 1.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.9); background: rgba(0,0,0,0.85); padding: 5px; border-radius: 4px; word-break: break-all; margin: auto 0; border: 1px solid rgba(0,230,118,0.3); }
    .visor-status { font-size: 10px; color: #ffd700; text-align: center; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.9); background: rgba(0,0,0,0.7); padding: 3px; border-radius: 4px; }

    /* Pop-up de Sucesso */
    #notificacao-discreta { display: none; position: absolute; top: 10px; left: 5%; width: 90%; background: #12121a; border: 2px solid #00e676; border-radius: 8px; padding: 8px 12px; z-index: 100; box-shadow: 0 4px 15px rgba(0,230,118,0.4); text-align: left; animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    #notificacao-discreta .titulo { font-size: 10px; color: #00e676; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    #notificacao-discreta .hu-codigo { font-family: monospace; font-size: 15px; color: #fff; font-weight: bold; margin-top: 2px; letter-spacing: 1px; }

    /* Painel de HUs Pendentes (Abaixo da Câmera) */
    #painel-pendentes { background: #12121a; border: 1px solid #2a2a3a; border-radius: 10px; padding: 10px; height: 160px; display: flex; flex-direction: column; flex-shrink: 0; }
    .pendentes-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #222230; }
    .pendentes-header h3 { font-size: 11px; color: #ff5252; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; }
    .pendentes-header span { font-size: 10px; background: rgba(255, 82, 82, 0.2); color: #ff5252; padding: 2px 6px; border-radius: 10px; font-weight: bold; }

    .lista-hus { display: flex; flex-wrap: wrap; gap: 6px; overflow-y: auto; flex: 1; padding-right: 2px; align-content: flex-start; }
    .lista-hus::-webkit-scrollbar { width: 4px; }
    .lista-hus::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 4px; }

    .hu-chip { background: #1c1c2b; border: 1px solid #33334a; color: #ddd; font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold; padding: 6px 10px; border-radius: 6px; display: flex; align-items: center; gap: 6px; transition: all 0.3s ease; }
    .hu-chip.removendo { transform: scale(0.8); opacity: 0; background: #00e676; color: #000; }
    .hu-chip .sufixo { color: #ffd700; font-weight: 900; }

    .lista-vazia { width: 100%; text-align: center; color: #00e676; font-size: 12px; font-weight: bold; margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }

    @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    #canvas-processamento { display: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Dashboard Slim -->
    <div id="dashboard">
      <div class="card found">
        <p>Encontradas</p>
        <h2 id="qtd-encontradas">-</h2>
      </div>
      <div class="card missing">
        <p>Faltam</p>
        <h2 id="qtd-faltam">-</h2>
      </div>
    </div>

    <!-- Câmera com Leitura Inteligente -->
    <div id="video-container">
      <video id="webcam" autoplay playsinline></video>
      
      <!-- Botão de Lanterna -->
      <button id="btn-lanterna" onclick="alternarLanterna()">
        <span>💡</span> Lanterna
      </button>

      <!-- Pop-up de Notificação -->
      <div id="notificacao-discreta">
        <div class="titulo">✓ HU Registrada na Planilha</div>
        <div id="hu-notificacao-texto" class="hu-codigo">000000000000000000</div>
      </div>

      <!-- Mira Adaptativa -->
      <div id="mira-box" class="mira">
        <div class="visor-topo">
          <span id="modo-leitura">PADRÃO GS1: 1789... (18 DÍGITOS)</span>
          <span id="contador-digitos">0 / 18</span>
        </div>
        <div id="numeros-lidos" class="visor-numeros">Aguardando...</div>
        <div id="dica-status" class="visor-status">Iniciando câmera...</div>
      </div>
    </div>

    <!-- Lista de HUs Pendentes (Desaparecem ao encontrar) -->
    <div id="painel-pendentes">
      <div class="pendentes-header">
        <h3>⏳ HUs Pendentes</h3>
        <span id="badge-contador">0 RESTANTES</span>
      </div>
      <div id="container-lista-hus" class="lista-hus">
        <div class="lista-vazia">Carregando lista de HUs...</div>
      </div>
    </div>
  </div>

  <canvas id="canvas-processamento"></canvas>

  <script>
    // =================================================================
    // ⚠️ COLOQUE AQUI A SUA URL DO GOOGLE APPS SCRIPT:
    const SCRIPT_URL = "SUA_URL_DO_GOOGLE_APPS_SCRIPT_AQUI";
    // =================================================================

    const video = document.getElementById('webcam');
    const miraBox = document.getElementById('mira-box');
    const numerosLidosEl = document.getElementById('numeros-lidos');
    const contadorDigitosEl = document.getElementById('contador-digitos');
    const dicaStatusEl = document.getElementById('dica-status');
    const modoLeituraEl = document.getElementById('modo-leitura');
    const notificacaoEl = document.getElementById('notificacao-discreta');
    const huNotificacaoTexto = document.getElementById('hu-notificacao-texto');
    const btnLanterna = document.getElementById('btn-lanterna');
    const containerListaHus = document.getElementById('container-lista-hus');
    const badgeContador = document.getElementById('badge-contador');
    const canvas = document.getElementById('canvas-processamento');

    let ocrAtivo = false;
    let processandoHU = false;
    let workerOCR = null;
    let lanternaLigada = false;
    let listaPendentesGlobal = [];

    function tocarBip() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch(e) {}
    }

    async function alternarLanterna() {
      const stream = video.srcObject;
      if (!stream) return;
      const track = stream.getVideoTracks()[0];
      try {
        const capabilities = track.getCapabilities();
        if (capabilities.torch) {
          lanternaLigada = !lanternaLigada;
          await track.applyConstraints({ advanced: [{ torch: lanternaLigada }] });
          btnLanterna.classList.toggle('ativo', lanternaLigada);
        } else {
          alert("Lanterna não suportada neste dispositivo.");
        }
      } catch(e) {}
    }

    // Busca dados da planilha e atualiza Dashboard + Lista de Pendentes
    async function atualizarDashboard() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        
        document.getElementById('qtd-encontradas').innerText = data.encontradas;
        document.getElementById('qtd-faltam').innerText = data.pendentes;

        // Se a planilha enviar a lista de HUs pendentes no JSON:
        if (data.lista_pendentes) {
          renderizarListaPendentes(data.lista_pendentes);
        }
      } catch (e) {}
    }

    // Desenha as HUs pendentes na tela
    function renderizarListaPendentes(lista) {
      listaPendentesGlobal = lista;
      badgeContador.innerText = `${lista.length} RESTANTES`;

      if (lista.length === 0) {
        containerListaHus.innerHTML = `
          <div class="lista-vazia">
            <span>🎉 PARABÉNS!</span>
            <span>Todas as HUs foram bipadas com sucesso.</span>
          </div>`;
        return;
      }

      // Constrói os chips mostrando o número e destacando os últimos dígitos
      containerListaHus.innerHTML = lista.map(hu => {
        const huStr = String(hu);
        const inicio = huStr.substring(0, huStr.length - 4);
        const final = huStr.substring(huStr.length - 4);
        return `
          <div class="hu-chip" id="chip-${huStr}">
            <span>${inicio}</span><span class="sufixo">${final}</span>
          </div>`;
      }).join('');
    }

    // Animação para remover a HU encontrada da lista visual instantaneamente
    function removerHuDaListaVisual(hu) {
      const chip = document.getElementById(`chip-${hu}`);
      if (chip) {
        chip.classList.add('removendo');
        setTimeout(() => {
          chip.remove();
          listaPendentesGlobal = listaPendentesGlobal.filter(item => String(item) !== String(hu));
          badgeContador.innerText = `${listaPendentesGlobal.length} RESTANTES`;
          
          if (listaPendentesGlobal.length === 0) {
            renderizarListaPendentes([]);
          }
        }, 300);
      }
    }

    navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: "environment", 
        width: { ideal: 1920 }, 
        height: { ideal: 1080 },
        focusMode: "continuous"
      } 
    })
    .then(stream => {
      video.srcObject = stream;
      iniciarOCR();
    })
    .catch(err => {
      dicaStatusEl.innerText = "❌ Permita o acesso à câmera.";
      dicaStatusEl.style.color = "#ff5252";
    });

    async function iniciarOCR() {
      dicaStatusEl.innerText = "⚡ Carregando Reconhecedor Otimizado...";
      
      workerOCR = await Tesseract.createWorker('eng');
      
      await workerOCR.setParameters({
        tessedit_char_whitelist: '0123456789()WMSwms',
        tessedit_pageseg_mode: '6',
      });

      dicaStatusEl.innerText = "🟢 Aponte a mira para o número 1789...";
      dicaStatusEl.style.color = "#00e676";
      ocrAtivo = true;

      loopOCR();
    }

    function aplicarBinarizacaoOtsu(ctx, width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;
      const histogram = new Array(256).fill(0);

      for (let i = 0; i < data.length; i += 4) {
        const gray = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
        data[i] = data[i+1] = data[i+2] = gray;
        histogram[gray]++;
      }

      const total = width * height;
      let sum = 0;
      for (let i = 0; i < 256; i++) sum += i * histogram[i];

      let sumB = 0, wB = 0, wF = 0, maxVariance = 0, threshold = 128;

      for (let t = 0; t < 256; t++) {
        wB += histogram[t];
        if (wB === 0) continue;
        wF = total - wB;
        if (wF === 0) break;

        sumB += t * histogram[t];
        const mB = sumB / wB;
        const mF = (sum - sumB) / wF;

        const variance = wB * wF * (mB - mF) * (mB - mF);
        if (variance > maxVariance) {
          maxVariance = variance;
          threshold = t;
        }
      }

      for (let i = 0; i < data.length; i += 4) {
        const val = data[i] < threshold ? 0 : 255;
        data[i] = data[i+1] = data[i+2] = val;
      }

      ctx.putImageData(imgData, 0, 0);
    }

    async function loopOCR() {
      if (!ocrAtivo || processandoHU) {
        setTimeout(loopOCR, 150);
        return;
      }

      try {
        miraBox.classList.add('lendo');
        
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        
        if (vw > 0 && vh > 0) {
          const CROP_W = vw * 0.92;
          const CROP_H = vh * 0.38;
          
          canvas.width = CROP_W * 2;
          canvas.height = CROP_H * 2;
          const ctx = canvas.getContext('2d');
          
          ctx.drawImage(video, vw * 0.04, vh * 0.28, CROP_W, CROP_H, 0, 0, canvas.width, canvas.height);
          aplicarBinarizacaoOtsu(ctx, canvas.width, canvas.height);

          const result = await workerOCR.recognize(canvas);
          const rawText = result.data.text || "";

          const REGEX_SSCC = /1789\d{14}/;
          const textoLimpo = rawText.replace(/[^\d]/g, '');
          const match = textoLimpo.match(REGEX_SSCC);

          let huEncontrada = match ? match[0] : null;

          if (huEncontrada) {
            numerosLidosEl.innerText = huEncontrada;
            contadorDigitosEl.innerText = "18 / 18";
            modoLeituraEl.innerText = "🎯 DÍGITOS 1789 RECONHECIDOS";
            dicaStatusEl.innerText = "✓ SSCC Confirmado!";
            dicaStatusEl.style.color = "#00e676";
            
            miraBox.classList.remove('lendo');
            miraBox.classList.add('sucesso');
            
            await verificarHU(huEncontrada);
          } else {
            const indexInicio = textoLimpo.indexOf('1789');

            if (indexInicio !== -1) {
              const parcial = textoLimpo.substring(indexInicio, indexInicio + 18);
              numerosLidosEl.innerText = parcial;
              contadorDigitosEl.innerText = `${parcial.length} / 18`;
              dicaStatusEl.innerText = "👁️ Lendo sequência 1789...";
              dicaStatusEl.style.color = "#ffd700";
            } else {
              numerosLidosEl.innerText = "Aguardando 1789...";
              contadorDigitosEl.innerText = "0 / 18";
              dicaStatusEl.innerText = "🟢 Enquadre o código de 18 dígitos";
              dicaStatusEl.style.color = "#00e676";
            }
          }
        }
        miraBox.classList.remove('lendo');
      } catch (e) {
        console.error(e);
      }

      setTimeout(loopOCR, 150);
    }

    async function verificarHU(hu) {
      processandoHU = true;
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ hu: hu })
        });
        const data = await res.json();

        if (data.status === "sucesso") {
          tocarBip();
          
          huNotificacaoTexto.innerText = hu;
          notificacaoEl.style.display = 'block';
          
          // Remove o card da tela instantaneamente
          removerHuDaListaVisual(hu);
          atualizarDashboard();

          setTimeout(() => {
            notificacaoEl.style.display = 'none';
            resetarVisor();
            processandoHU = false;
          }, 2500);

        } else if (data.status === "ja_lido") {
          dicaStatusEl.innerText = `⚠️ HU ${hu} JÁ FOI LIDA!`;
          dicaStatusEl.style.color = "#ff9800";
          setTimeout(() => { resetarVisor(); processandoHU = false; }, 2000);
        } else {
          dicaStatusEl.innerText = `❌ HU ${hu} não pertence à lista!`;
          dicaStatusEl.style.color = "#ff5252";
          setTimeout(() => { resetarVisor(); processandoHU = false; }, 2000);
        }
      } catch (e) {
        dicaStatusEl.innerText = "❌ Erro ao conectar com a Planilha.";
        dicaStatusEl.style.color = "#ff5252";
        setTimeout(() => { resetarVisor(); processandoHU = false; }, 2000);
      }
    }

    function resetarVisor() {
      miraBox.classList.remove('sucesso');
      numerosLidosEl.innerText = "Aguardando 1789...";
      contadorDigitosEl.innerText = "0 / 18";
      modoLeituraEl.innerText = "PADRÃO GS1: 1789... (18 DÍGITOS)";
      dicaStatusEl.innerText = "🟢 Aponte a mira para o número 1789...";
      dicaStatusEl.style.color = "#00e676";
    }

    atualizarDashboard();
    setInterval(atualizarDashboard, 5000);
  </script>
</body>
</html>
