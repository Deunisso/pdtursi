<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leitor de HU - Paisagem</title>
  
  <!-- Biblioteca Html5-QRCode -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
    }

    /* Layout Horizontal (Paisagem) */
    .app-container {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100%;
    }

    /* Área do Vídeo (Lado Esquerdo / Maior Parte) */
    .scanner-section {
      flex: 2;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #reader {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    /* Mira/Identificador Verde */
    .scanner-target {
      position: absolute;
      width: 70%;
      height: 35%;
      border: 3px solid #00ff66;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.4), inset 0 0 15px rgba(0, 255, 102, 0.2);
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 10;
    }

    /* Efeito visual quando lê com sucesso */
    .scanner-target.success {
      background-color: rgba(0, 255, 102, 0.3);
      border-color: #ffffff;
      box-shadow: 0 0 25px #00ff66;
    }

    /* Painel de Informações (Lado Direito) */
    .info-section {
      flex: 1;
      background: #1e1e1e;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-left: 2px solid #2a2a2a;
    }

    .title {
      font-size: 0.9rem;
      color: #00ff66;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .result-box {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #00ff66;
      margin-bottom: 20px;
    }

    .result-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
      word-break: break-all;
    }

    .status-text {
      font-size: 0.85rem;
      color: #aaa;
    }

    /* Alerta para virar o celular se estiver em pé */
    @media screen and (orientation: portrait) {
      body::before {
        content: "🔄 Por favor, vire o celular deitado (Paisagem)";
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #121212;
        color: #00ff66;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        font-weight: bold;
        text-align: center;
        padding: 20px;
        z-index: 9999;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Esquerda: Câmera + Mira Verde -->
    <div class="scanner-section">
      <div id="reader"></div>
      <div id="target" class="scanner-target"></div>
    </div>

    <!-- Direita: Dados lidos -->
    <div class="info-section">
      <div class="title">Código HU / GS1-128</div>
      <div class="result-box">
        <div id="result" class="result-value">Aguardando leitura...</div>
      </div>
      <div class="status-text">Mantenha o código dentro do retângulo verde.</div>
    </div>
  </div>

  <script>
    const resultElement = document.getElementById('result');
    const targetElement = document.getElementById('target');
    let html5QrCode;
    let audioCtx = null;

    // --- FUNÇÃO DO BIPADOR NATIVO (Sem precisar de arquivo de áudio) ---
    function tocarBip() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(1800, audioCtx.currentTime); // Frequência do Bip (Agudo)
        
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); // Volume
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.12); // Duração curta

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.12);
      } catch (e) {
        console.error("Erro ao tocar bip:", e);
      }
    }

    // --- AÇÃO AO LER COM SUCESSO ---
    function onScanSuccess(decodedText) {
      // 1. Toca o Som do Bipador
      tocarBip();

      // 2. Vibração (se suportado pelo celular)
      if (navigator.vibrate) navigator.vibrate(100);

      // 3. Trata e exibe o código
      const codigoLimpo = decodedText.replace(/[\(\)\s]/g, '');
      resultElement.innerText = codigoLimpo;

      // 4. Feedback Visual na Mira Verde (Pisca em verde brilhante)
      targetElement.classList.add('success');
      setTimeout(() => {
        targetElement.classList.remove('success');
      }, 300);

      // Pausa rápida para não ler várias vezes o mesmo código
      html5QrCode.pause();
      setTimeout(() => {
        html5QrCode.resume();
      }, 1500);
    }

    // --- INICIALIZAR CÂMERA ---
    async function iniciarLeitorPaisagem() {
      // Tenta travar a tela em paisagem se o navegador permitir
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }

      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 25,
        qrbox: { width: 350, height: 150 },
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      };

      try {
        await html5QrCode.start(
          { facingMode: "environment" }, // Força câmera traseira
          config, 
          onScanSuccess,
          () => {} // Ignora falhas de enquadramento contínuas
        );
      } catch (err) {
        console.error("Erro ao iniciar câmera:", err);
        resultElement.innerText = "Erro na câmera traseira.";
      }
    }

    // Desbloqueia áudio no primeiro clique do usuário (exigência dos navegadores modernos)
    document.body.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }, { once: true });

    window.addEventListener('DOMContentLoaded', iniciarLeitorPaisagem);
  </script>
</body>
</html>
