<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner Tela Inteira (HUD)</title>

  <!-- Biblioteca para leitura de Código de Barras -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA INICIAL DE PERMISSÃO (Evita tela preta por bloqueio do navegador) -->
  <div id="overlay-inicio" class="overlay-start">
    <div class="start-box">
      <h2>📷 Leitor de HUs</h2>
      <p>Toque no botão abaixo para ativar a câmera e começar a conferência.</p>
      <button id="btn-iniciar" onclick="iniciarAplicacao()">LIGAR CÂMERA</button>
    </div>
  </div>

  <!-- CÂMERA EM TELA INTEIRA -->
  <div id="scanner-container" class="scanner-fullscreen">
    <div id="reader"></div>

    <!-- Laser e Miras de Varredura -->
    <div class="laser-line"></div>
    <div class="mira top-left"></div>
    <div class="mira top-right"></div>
    <div class="mira bottom-left"></div>
    <div class="mira bottom-right"></div>

    <!-- HUD SOBREPOSTO: PAINEL SUPERIOR -->
    <div class="hud-top">
      <div class="sync-badge">
        <span id="sync-dot" class="dot"></span>
        <span id="sync-texto">Conectando...</span>
      </div>

      <div class="counter-box">
        <span class="counter-label">FALTAM CONFERIR</span>
        <span id="qtd-restante" class="counter-number">--</span>
        <span id="qtd-total" class="counter-sub">de -- itens</span>
      </div>
    </div>

    <!-- HUD SOBREPOSTO: PAINEL INFERIOR -->
    <div id="card-ultimo-bip" class="hud-bottom sem-leitura">
      <div class="bip-status-title" id="bip-status-title">Aguardando leitura...</div>
      <div class="bip-hu-code" id="bip-hu-code">APONTE A CÂMERA</div>
      <div class="bip-detalhes" id="bip-detalhes">Posição / Bin aparecerão aqui</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
