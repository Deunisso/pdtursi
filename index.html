<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conferência de HUs (Scanner Compacto)</title>
  
  <!-- Biblioteca para leitura de Código de Barras via Câmera -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- Estilos CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="header-panel">
      <div class="sync-status">
        <span id="sync-dot" class="dot"></span>
        <span id="sync-texto">Conectando...</span>
      </div>
      <h2>Lista de Conferência (LX02)</h2>
      <div id="progresso-texto" style="font-size: 0.85rem; color: #5f6368;">Carregando...</div>
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
    </div>

    <!-- CÂMERA EM FORMATO TARJA COM LASER E MIRAS -->
    <div id="scanner-container" class="scanner-wrapper">
      <div id="reader"></div>
      <div class="laser-line"></div>
      <div class="mira top-left"></div>
      <div class="mira top-right"></div>
      <div class="mira bottom-left"></div>
      <div class="mira bottom-right"></div>
      <div id="scanner-text" class="scanner-status">🔍 BUSCANDO CÓDIGO DE BARRAS...</div>
    </div>

    <!-- Mensagens de Alerta (Sucesso/Erro) -->
    <div id="feedback"></div>

    <!-- Container da Lista de HUs -->
    <div class="list-title">Itens para Encontrar:</div>
    <div id="lista-container" class="lista-hus"></div>

    <!-- PAINEL DE LOGS -->
    <div class="list-title" style="color: #1a73e8; margin-top: 30px;">🐞 Diagnóstico em Tempo Real:</div>
    <div id="painel-logs">
      <div class="log-entry"><span class="log-info">[Sistema] Scanner visual ativado...</span></div>
    </div>
  </div>

  <!-- Lógica e Comportamento JS -->
  <script src="script.js"></script>
</body>
</html>
