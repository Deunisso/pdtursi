<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Leitor HU Industrial</title>

    <!-- PWA -->
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- ZXing (compatibilidade Chrome + Safari + iPhone + Android) -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>

<body>

    <div class="camera-container">

        <!-- Câmera -->
        <video id="video" autoplay playsinline muted></video>

        <!-- Canvas onde será desenhada a caixa verde -->
        <canvas id="overlay"></canvas>

        <!-- Mira central -->
        <div class="scanner-area">
            <div class="scanner-line"></div>
        </div>

        <!-- Painel inferior -->
        <div class="status-card">

            <div class="status-top">

                <div>
                    <div class="label">
                        STATUS
                    </div>

                    <div id="statusLabel" class="status">
                        Inicializando...
                    </div>
                </div>

                <div class="led" id="led"></div>

            </div>

            <div class="divider"></div>

            <div class="label">
                HU LIDA
            </div>

            <div id="huResult" class="value">
                Aguardando...
            </div>

            <div class="buttons">

                <button id="btnRestart">
                    Nova leitura
                </button>

                <button id="btnTorch">
                    Lanterna
                </button>

            </div>

        </div>

    </div>

    <!-- Som do bip -->
    <audio id="beep" preload="auto">
        <source src="beep.mp3" type="audio/mpeg">
    </audio>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
