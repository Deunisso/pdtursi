<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leitor Retrato SSCC (Barras + OCR)</title>

  <!-- Leitor de Código de Barras -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <!-- IA para Reconhecimento de Texto -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; font-family: system-ui, -apple-system, sans-serif; height: 100vh; width: 100vw; overflow: hidden; color: #fff; }

    #container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* Canvas para processamento de IA */
    #crop-canvas { display: none; }

    /* Mira Otimizada para Modo Retrato */
    .viewport-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 94%;
      max-width: 420px;
      height: 120px;
      border: 3px solid #00ff66;
      border-radius: 12px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.65);
      pointer-events: none;
      z-index: 5;
    }

    .laser {
      position: absolute;
      width: 100%;
      height: 2px;
      background: #ff3333;
      box-shadow: 0 0 10px #ff3333;
      top: 50%;
      animation: scan 1.5s infinite ease-in-out;
    }

    @keyframes scan {
      0%, 100% { top: 10%; opacity: 0.2; }
      50% { top: 90%; opacity: 1; }
    }

    /* Painel Inferior */
    #status-bar {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(15, 15, 15, 0.95);
      padding: 16px;
      text-align: center;
      z-index: 10;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .msg-status { font-size: 0.85rem; color: #ffeb3b; font-weight: 600; margin-bottom: 4px; }
    .msg-code { font-size: 1.4rem; color: #00ff66; font-weight: bold; letter-spacing: 1px; word-break: break-all; }
    .engine-tag { font-size: 0.75rem; color: #aaa; margin-top: 4px; }
  </style>
</head>
<body>

  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="crop-canvas"></canvas>
    
    <div class="viewport-guide" id="guide">
      <div class="laser"></div>
    </div>

    <div id="status-bar">
      <div id="status-text" class="msg-status">📱 Modo Retrato Ativo. Aguardando câmera...</div>
      <div id="result-text" class="msg-code">---</div>
      <div id="engine-text" class="engine-tag">Modo Híbrido: Barras + OCR</div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const cropCanvas = document.getElementById('crop-canvas');
    const guide = document.getElementById('guide');
    const statusText = document.getElementById('status-text');
    const resultText = document.getElementById('result-text');
    const engineText = document.getElementById('engine-text');

    let barcodeDetector = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['code_128'] }) : null;
    let ocrWorker = null;
    let isProcessingOcr = false;
    let lastFoundCode = "";

    // Inicializa a IA Tesseract (apenas para números)
    async function initOCR() {
      engineText.innerText = "Carregando IA em modo retrato...";
      ocrWorker = await Tesseract.createWorker('eng');
      await ocrWorker.setParameters({
        tessedit_char_whitelist: '0123456789()',
      });
      engineText.innerText = "Modo Retrato: Barras + IA Ativo";
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });

        video.srcObject = stream;
        await video.play();

        await initOCR();
        statusText.innerText = "🔍 Enquadre o código na caixa verde";

        // Ciclos de Leitura
        scanLoop();
        setInterval(ocrFallbackLoop, 700);

      } catch (err) {
        console.error("Erro na câmera:", err);
        statusText.innerText = "❌ Permissão de câmera necessária.";
      }
    }

    // --- LEITURA POR BARRAS (Hardware Nativo) ---
    async function scanLoop() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && barcodeDetector) {
        try {
          const barcodes = await barcodeDetector.detect(video);
          if (barcodes.length > 0) {
            for (const barcode of barcodes) {
              validateAndSetResult(barcode.rawValue, "Código de Barras");
            }
          }
        } catch (e) {}
      }
      requestAnimationFrame(scanLoop);
    }

    // --- LEITURA POR IA (OCR Dinâmico em Retrato) ---
    async function ocrFallbackLoop() {
      if (!ocrWorker || isProcessingOcr || video.readyState !== video.HAVE_ENOUGH_DATA) return;

      isProcessingOcr = true;

      try {
        // Calcula a posição exata da mira em relação à resolução real do vídeo
        const videoRect = video.getBoundingClientRect();
        const guideRect = guide.getBoundingClientRect();

        const scaleX = video.videoWidth / videoRect.width;
        const scaleY = video.videoHeight / videoRect.height;

        const cropX = (guideRect.left - videoRect.left) * scaleX;
        const cropY = (guideRect.top - videoRect.top) * scaleY;
        const cropW = guideRect.width * scaleX;
        const cropH = guideRect.height * scaleY;

        // Ajusta o canvas de recorte
        cropCanvas.width = cropW;
        cropCanvas.height = cropH;

        const ctx = cropCanvas.getContext('2d');
        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

        // Processa o recorte com a IA
        const { data: { text } } = await ocrWorker.recognize(cropCanvas);
        
        if (text) {
          validateAndSetResult(text, "IA / OCR (Números)");
        }
      } catch (err) {
        console.log("Erro OCR:", err);
      } finally {
        isProcessingOcr = false;
      }
    }

    // --- VALIDAÇÃO DO CÓDIGO (18 DÍGITOS DO SSCC) ---
    function validateAndSetResult(rawText, metodoUsado) {
      const clean = rawText.replace(/\s+/g, '');
      const match = clean.match(/\d{18}/);

      if (match) {
        const codigoFormatado = `(00)${match[0]}`;

        if (lastFoundCode !== codigoFormatado) {
          lastFoundCode = codigoFormatado;
          resultText.innerText = codigoFormatado;
          statusText.innerText = `✅ LIDO VIA: ${metodoUsado.toUpperCase()}`;
          statusText.style.color = "#00ff66";

          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }
      }
    }

    window.addEventListener('load', initCamera);
  </script>
</body>
</html>
