<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WMS - Leitor Ultra Rápido HU (1789)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { width: 100%; height: 100vh; overflow: hidden; background: #0b0b10; color: #fff; }
    
    .app-container { display: flex; flex-direction: column; height: 100vh; padding: 8px; justify-content: space-between; }

    /* Dashboard Slim */
    #dashboard { display: flex; justify-content: space-between; gap: 8px; height: 58px; }
    .card { background: #161622; border-radius: 8px; flex: 1; padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-bottom: 3px solid #333; }
    .card.found { border-color: #00e676; }
    .card.missing { border-color: #ff5252; }
    .card p { font-size: 10px; color: #aaa; text-transform: uppercase; font-weight: bold; }
    .card h2 { font-size: 22px; margin-top: 2px; }
    .found h2 { color: #00e676; }
    .missing h2 { color: #ff5252; }

    /* Câmera Central */
    #video-container { position: relative; flex: 1; margin: 8px 0; border-radius: 12px; overflow: hidden; border: 2px solid #2a2a3a; background: #000; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* Botão Flutuante de Lanterna */
    #btn-lanterna { position: absolute; top: 12px; right: 12px; z-index: 50; background: rgba(22, 22, 34, 0.85); border: 1px solid #00d2ff; color: #00d2ff; padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; backdrop-filter: blur(4px); display: flex; align-items: center; gap: 6px; }
    #btn-lanterna.ativo { background: #00d2ff; color: #000; box-shadow: 0 0 10px #00d2ff; }

    /* Mira Adaptativa com Efeito de Leitura */
    .mira { position: absolute; top: 32%; left: 4%; width: 92%; height: 32%; border: 2px dashed #00d2ff; box-shadow: 0 0 0 999px rgba(0,0,0,0.65); border-radius: 8px; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 8px 12px; transition: all 0.2s ease; }
    .mira.lendo { border-color: #ffd700; }
    .mira.sucesso { border-color: #00e676; background: rgba(0, 230, 118, 0.18); box-shadow: 0 0 0 999px rgba(0,0,0,0.65), 0 0 25px #00e676; }

    /* Visor Interno de Leitura */
    .visor-topo { display: flex; justify-content: space-between; font-size: 10px; color: #00d2ff; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.9); }
    .visor-numeros { font-family: 'Courier New', monospace; font-size: 18px; font-weight: 900; color: #00e676; text-align: center; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.9); background: rgba(0,0,0,0.85); padding: 6px; border-radius: 4px; word-break: break-all; margin: auto 0; border: 1px solid rgba(0,230,118,0.3); }
    .visor-status { font-size: 10px; color: #ffd700; text-align: center; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.9); background: rgba(0,0,0,0.7); padding: 3px; border-radius: 4px; }

    /* Pop-up de Sucesso */
    #notificacao-discreta { display: none; position: absolute; top: 12px; left: 5%; width: 90%; background: #12121a; border: 2px solid #00e676; border-radius: 8px; padding: 10px 15px; z-index: 100; box-shadow: 0 4px 15px rgba(0,230,118,0.4); text-align: left; animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    #notificacao-discreta .titulo { font-size: 11px; color: #00e676; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    #notificacao-discreta .hu-codigo { font-family: monospace; font-size: 17px; color: #fff; font-weight: bold; margin-top: 2px; letter-spacing: 1.5px; }

    @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    #canvas-processamento { display: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Dashboard Slim -->
    <div id="dashboard">
      <div class="card found">
        <p>Encontradas</p>
        <h2 id="qtd-encontradas">-</h2>
      </div>
      <div class="card missing">
        <p>Faltam</p>
        <h2 id="qtd-faltam">-</h2>
      </div>
    </div>

    <!-- Câmera com Binarização de Imagem em Tempo Real -->
    <div id="video-container">
      <video id="webcam" autoplay playsinline></video>
      
      <!-- Botão de Lanterna -->
      <button id="btn-lanterna" onclick="alternarLanterna()">
        <span>💡</span> Lanterna
      </button>

      <!-- Pop-up de Notificação -->
      <div id="notificacao-discreta">
        <div class="titulo">✓ HU Registrada na Planilha</div>
        <div id="hu-notificacao-texto" class="hu-codigo">000000000000000000</div>
      </div>

      <!-- Mira Adaptativa -->
      <div id="mira-box" class="mira">
        <div class="visor-topo">
          <span id="modo-leitura">PADRÃO GS1: 1789... (18 DÍGITOS)</span>
          <span id="contador-digitos">0 / 18</span>
        </div>
        <div id="numeros-lidos" class="visor-numeros">Aguardando...</div>
        <div id="dica-status" class="visor-status">Iniciando câmera...</div>
      </div>
    </div>
  </div>

  <canvas id="canvas-processamento"></canvas>

  <script>
    // =================================================================
    // ⚠️ COLOQUE AQUI A SUA URL DO GOOGLE APPS SCRIPT:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvKN1zlgTn2F-iY-CgqU9bcSuvBgRvtAMQGeMsa9psE2B7snJ6d8Ov1dCLbiL0YVWt_A/exec";
    // =================================================================

    const video = document.getElementById('webcam');
    const miraBox = document.getElementById('mira-box');
    const numerosLidosEl = document.getElementById('numeros-lidos');
    const contadorDigitosEl = document.getElementById('contador-digitos');
    const dicaStatusEl = document.getElementById('dica-status');
    const modoLeituraEl = document.getElementById('modo-leitura');
    const notificacaoEl = document.getElementById('notificacao-discreta');
    const huNotificacaoTexto = document.getElementById('hu-notificacao-texto');
    const btnLanterna = document.getElementById('btn-lanterna');
    const canvas = document.getElementById('canvas-processamento');

    let ocrAtivo = false;
    let processandoHU = false;
    let workerOCR = null;
    let lanternaLigada = false;

    // Toca o bip sonoro no leitor
    function tocarBip() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch(e) {}
    }

    // Liga / Desliga a Lanterna do Smartphone
    async function alternarLanterna() {
      const stream = video.srcObject;
      if (!stream) return;
      const track = stream.getVideoTracks()[0];
      try {
        const capabilities = track.getCapabilities();
        if (capabilities.torch) {
          lanternaLigada = !lanternaLigada;
          await track.applyConstraints({ advanced: [{ torch: lanternaLigada }] });
          btnLanterna.classList.toggle('ativo', lanternaLigada);
        } else {
          alert("Lanterna não suportada neste dispositivo.");
        }
      } catch(e) {
        console.warn("Erro ao acionar lanterna:", e);
      }
    }

    // Atualiza contadores do topo via Google Apps Script
    async function atualizarDashboard() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        document.getElementById('qtd-encontradas').innerText = data.encontradas;
        document.getElementById('qtd-faltam').innerText = data.pendentes;
      } catch (e) {}
    }

    // Acesso à Câmera Traseira em HD
    navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: "environment", 
        width: { ideal: 1920 }, 
        height: { ideal: 1080 },
        focusMode: "continuous"
      } 
    })
    .then(stream => {
      video.srcObject = stream;
      iniciarOCR();
    })
    .catch(err => {
      dicaStatusEl.innerText = "❌ Permita o acesso à câmera.";
      dicaStatusEl.style.color = "#ff5252";
    });

    // Inicialização do Motor de Reconhecimento
    async function iniciarOCR() {
      dicaStatusEl.innerText = "⚡ Carregando Reconhecedor Otimizado...";
      
      workerOCR = await Tesseract.createWorker('eng');
      
      // Limita os caracteres apenas ao necessário (números, parênteses e WMS)
      // PSM 6 = Assume bloco rígido de texto único (Acelera a leitura em 3x)
      await workerOCR.setParameters({
        tessedit_char_whitelist: '0123456789()WMSwms',
        tessedit_pageseg_mode: '6',
      });

      dicaStatusEl.innerText = "🟢 Aponte a mira para o número 1789...";
      dicaStatusEl.style.color = "#00e676";
      ocrAtivo = true;

      loopOCR();
    }

    // 🧠 ALGORITMO DE BINARIZAÇÃO DE OTSU (Transforma o Canvas em P&B Puro de Alto Contraste)
    function aplicarBinarizacaoOtsu(ctx, width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;
      const histogram = new Array(256).fill(0);

      // 1. Converte para Escala de Cinza e calcula o histograma
      for (let i = 0; i < data.length; i += 4) {
        const gray = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
        data[i] = data[i+1] = data[i+2] = gray;
        histogram[gray]++;
      }

      // 2. Calcula o limiar ideal de separação (Limiar de Otsu)
      const total = width * height;
      let sum = 0;
      for (let i = 0; i < 256; i++) sum += i * histogram[i];

      let sumB = 0, wB = 0, wF = 0, maxVariance = 0, threshold = 128;

      for (let t = 0; t < 256; t++) {
        wB += histogram[t];
        if (wB === 0) continue;
        wF = total - wB;
        if (wF === 0) break;

        sumB += t * histogram[t];
        const mB = sumB / wB;
        const mF = (sum - sumB) / wF;

        const variance = wB * wF * (mB - mF) * (mB - mF);
        if (variance > maxVariance) {
          maxVariance = variance;
          threshold = t;
        }
      }

      // 3. Aplica o limiar: tudo que é texto vira PRETO (0), fundo vira BRANCO (255)
      for (let i = 0; i < data.length; i += 4) {
        const val = data[i] < threshold ? 0 : 255;
        data[i] = data[i+1] = data[i+2] = val;
      }

      ctx.putImageData(imgData, 0, 0);
    }

    // Loop de Processamento
    async function loopOCR() {
      if (!ocrAtivo || processandoHU) {
        setTimeout(loopOCR, 150);
        return;
      }

      try {
        miraBox.classList.add('lendo');
        
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        
        if (vw > 0 && vh > 0) {
          // Amplia a imagem da mira em 2x no Canvas (Zoom Digital para nitidez de caracteres)
          const CROP_W = vw * 0.92;
          const CROP_H = vh * 0.32;
          
          canvas.width = CROP_W * 2;
          canvas.height = CROP_H * 2;
          const ctx = canvas.getContext('2d');
          
          // Desenha o recorte da mira com escala 2x
          ctx.drawImage(video, vw * 0.04, vh * 0.32, CROP_W, CROP_H, 0, 0, canvas.width, canvas.height);

          // Aplica o pré-processamento de imagem (Binarização P&B de alto contraste)
          aplicarBinarizacaoOtsu(ctx, canvas.width, canvas.height);

          // Executa a leitura no Canvas tratado
          const result = await workerOCR.recognize(canvas);
          const rawText = result.data.text || "";

          // REGEX GS1 SSCC: Busca obrigatoriamente a sequência 1789 com 18 dígitos
          // Ignora parênteses (00), espaços, traços ou prefixos como SSCC/WMS
          const REGEX_SSCC = /1789\d{14}/;

          // Remove caracteres indesejados para isolar os números
          const textoLimpo = rawText.replace(/[^\d]/g, '');
          const match = textoLimpo.match(REGEX_SSCC);

          let huEncontrada = match ? match[0] : null;

          // RESULTADO DA DETECÇÃO
          if (huEncontrada) {
            numerosLidosEl.innerText = huEncontrada;
            contadorDigitosEl.innerText = "18 / 18";
            modoLeituraEl.innerText = "🎯 DÍGITOS 1789 RECONHECIDOS";
            dicaStatusEl.innerText = "✓ SSCC Confirmado!";
            dicaStatusEl.style.color = "#00e676";
            
            miraBox.classList.remove('lendo');
            miraBox.classList.add('sucesso');
            
            await verificarHU(huEncontrada);
          } else {
            // Exibe parciais se já começou a ler '1789'
            const indexInicio = textoLimpo.indexOf('1789');

            if (indexInicio !== -1) {
              const parcial = textoLimpo.substring(indexInicio, indexInicio + 18);
              numerosLidosEl.innerText = parcial;
              contadorDigitosEl.innerText = `${parcial.length} / 18`;
              dicaStatusEl.innerText = "👁️ Lendo sequência 1789...";
              dicaStatusEl.style.color = "#ffd700";
            } else {
              numerosLidosEl.innerText = "Aguardando 1789...";
              contadorDigitosEl.innerText = "0 / 18";
              dicaStatusEl.innerText = "🟢 Enquadre o código de 18 dígitos";
              dicaStatusEl.style.color = "#00e676";
            }
          }
        }
        miraBox.classList.remove('lendo');
      } catch (e) {
        console.error(e);
      }

      setTimeout(loopOCR, 150);
    }

    // Envio e Validação na Planilha Google
    async function verificarHU(hu) {
      processandoHU = true;
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ hu: hu })
        });
        const data = await res.json();

        if (data.status === "sucesso") {
          tocarBip();
          
          huNotificacaoTexto.innerText = hu;
          notificacaoEl.style.display = 'block';
          
          atualizarDashboard();

          setTimeout(() => {
            notificacaoEl.style.display = 'none';
            resetarVisor();
            processandoHU = false;
          }, 2500);

        } else if (data.status === "ja_lido") {
          dicaStatusEl.innerText = `⚠️ HU ${hu} JÁ FOI LIDA!`;
          dicaStatusEl.style.color = "#ff9800";
          setTimeout(() => { resetarVisor(); processandoHU = false; }, 2000);
        } else {
          dicaStatusEl.innerText = `❌ HU ${hu} não pertence à lista!`;
          dicaStatusEl.style.color = "#ff5252";
          setTimeout(() => { resetarVisor(); processandoHU = false; }, 2000);
        }
      } catch (e) {
        dicaStatusEl.innerText = "❌ Erro ao conectar com a Planilha.";
        dicaStatusEl.style.color = "#ff5252";
        setTimeout(() => { resetarVisor(); processandoHU = false; }, 2000);
      }
    }

    function resetarVisor() {
      miraBox.classList.remove('sucesso');
      numerosLidosEl.innerText = "Aguardando 1789...";
      contadorDigitosEl.innerText = "0 / 18";
      modoLeituraEl.innerText = "PADRÃO GS1: 1789... (18 DÍGITOS)";
      dicaStatusEl.innerText = "🟢 Aponte a mira para o número 1789...";
      dicaStatusEl.style.color = "#00e676";
    }

    atualizarDashboard();
    setInterval(atualizarDashboard, 5000);
  </script>
</body>
</html>
