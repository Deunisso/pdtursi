<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leitor Rápido SSCC (00)</title>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; font-family: system-ui, sans-serif; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }

    /* Área principal da Câmera */
    #camera-wrapper { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #111; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* Overlay de Mira Visual */
    .scanner-overlay { position: absolute; width: 85%; height: 140px; border: 2px solid #00ff66; border-radius: 12px; box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.55); pointer-events: none; z-index: 5; }
    .laser-line { position: absolute; width: 100%; height: 3px; background: #ff3333; box-shadow: 0 0 8px #ff3333; top: 50%; animation: scan 1.8s infinite ease-in-out; }
    
    @keyframes scan {
      0%, 100% { top: 15%; opacity: 0.3; }
      50% { top: 85%; opacity: 1; }
    }

    /* Painel Inferior de Resultados */
    #status-panel { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); padding: 16px; color: #fff; text-align: center; z-index: 10; border-top: 1px solid rgba(255,255,255,0.1); }
    #status-text { font-size: 0.95rem; color: #ffeb3b; font-weight: bold; margin-bottom: 4px; }
    #result-text { font-size: 1.4rem; color: #00ff66; font-weight: bold; letter-spacing: 1px; min-height: 1.8rem; word-break: break-all; }

    /* Alerta para virar o celular */
    @media screen and (orientation: portrait) {
      #portrait-warning { position: fixed; inset: 0; background: #0d0d0d; color: #fff; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; font-size: 1.2rem; font-weight: bold; }
      #portrait-warning span { font-size: 3rem; margin-bottom: 10px; }
    }
    @media screen and (orientation: landscape) {
      #portrait-warning { display: none; }
    }
  </style>
</head>
<body>

  <!-- Aviso de Orientação -->
  <div id="portrait-warning">
    <span>🔄</span>
    Gire o celular para a posição HORIZONTAL (Paisagem)
  </div>

  <!-- Câmera e Mira -->
  <div id="camera-wrapper">
    <video id="video"></video>
    <div class="scanner-overlay">
      <div class="laser-line"></div>
    </div>
  </div>

  <!-- Status -->
  <div id="status-panel">
    <div id="status-text">🔍 Posicione as barras dentro do retângulo...</div>
    <div id="result-text">---</div>
  </div>

  <script>
    const videoElement = document.getElementById('video');
    const statusText = document.getElementById('status-text');
    const resultText = document.getElementById('result-text');

    // Inicializa o leitor ZXing Browser
    const codeReader = new ZXing.BrowserMultiFormatReader();
    
    // Filtra especificamente para o formato Code 128 (base do GS1-128 / SSCC)
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128]);
    codeReader.hints = hints;

    // Expressão regular para validar SSCC/GS1 de 18 dígitos com ou sem (00)
    const ssccRegex = /(?:^\(00\)|^00)?(\d{18})$/;

    async function startScanner() {
      try {
        const constraints = {
          video: {
            facingMode: 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            focusMode: 'continuous'
          }
        };

        statusText.innerText = "🎥 Câmera ativa. Buscando barras...";

        codeReader.decodeFromConstraints(constraints, videoElement, (result, err) => {
          if (result) {
            const rawText = result.getText().replace(/\s+/g, '');
            
            // Procura padrão de 18 dígitos do SSCC
            const match = rawText.match(/\d{18}/);
            
            if (match) {
              const codigoFormatado = `(00)${match[0]}`;
              resultText.innerText = codigoFormatado;
              statusText.innerText = "✅ Código Identificado!";
              statusText.style.color = "#00ff66";

              if (navigator.vibrate) navigator.vibrate(120);
            } else {
              // Se leu outro código de barras que não é o SSCC de 18 dígitos
              statusText.innerText = "⚠️ Código detectado, mas não é SSCC (00).";
              statusText.style.color = "#ff9800";
            }
          }
        });

      } catch (error) {
        console.error("Erro na câmera:", error);
        statusText.innerText = "❌ Erro ao acessar a câmera. Verifique as permissões.";
        statusText.style.color = "#ff3333";
      }
    }

    window.addEventListener('load', startScanner);
  </script>
</body>
</html>
