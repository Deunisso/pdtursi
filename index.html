<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conferência de HUs</title>
  
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; }
    
    .header-panel { background: #ffffff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; text-align: center; }
    .header-panel h2 { font-size: 1.1rem; color: #1a73e8; margin-bottom: 5px; }
    .progress-bar-container { background: #e0e0e0; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 10px; }
    .progress-bar { background: #34a853; height: 100%; width: 0%; transition: width 0.4s ease; }
    
    #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 2px solid #dadce0; background: #000; margin-bottom: 15px; }

    #feedback { padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; text-align: center; margin-bottom: 15px; display: none; }
    #feedback.sucesso { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    #feedback.erro { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    .list-title { font-size: 0.9rem; font-weight: bold; color: #5f6368; margin-bottom: 10px; text-transform: uppercase; }
    .lista-hus { display: flex; flex-direction: column; gap: 10px; }

    .hu-card {
      background: #ffffff;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }
    .hu-info { display: flex; flex-direction: column; gap: 3px; }
    .hu-codigo { font-weight: bold; font-size: 1rem; color: #202124; }
    .hu-detalhe { font-size: 0.82rem; color: #5f6368; }
    
    .badge {
      font-size: 0.75rem;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 20px;
      background: #e8eaed;
      color: #5f6368;
    }

    .hu-card.encontrado {
      background-color: #e6f4ea;
      border-color: #34a853;
    }
    .hu-card.encontrado .hu-codigo { color: #137333; }
    .hu-card.encontrado .badge {
      background-color: #34a853;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-panel">
      <h2>Lista de Conferência</h2>
      <div id="progresso-texto" style="font-size: 0.85rem; color: #5f6368;">Conectando ao Google Sheets...</div>
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
    </div>

    <div id="reader"></div>
    <div id="feedback"></div>

    <div class="list-title">Itens para Encontrar:</div>
    <div id="lista-container" class="lista-hus"></div>
  </div>

  <script>
    // ⚠️ COLE AQUI A URL DA SUA IMPLANTAÇÃO DO GOOGLE APPS SCRIPT
    const APPS_SCRIPT_URL = "SUA_URL_DO_WEB_APP_AQUI";

    let listaHUs = [];
    let html5QrCode;
    let aguardandoProcessamento = false;

    // 1. Busca os dados via API do Apps Script (fetch)
    async function carregarDados() {
      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=obterLista`);
        listaHUs = await response.json();
        renderizarLista();
        iniciarCamera();
      } catch (err) {
        mostrarFeedback("Erro ao carregar dados do Google Sheets.", false);
      }
    }

    // 2. Renderiza a lista na tela
    function renderizarLista() {
      const container = document.getElementById('lista-container');
      container.innerHTML = '';

      let encontrados = 0;

      listaHUs.forEach(item => {
        if (item.encontrado) encontrados++;

        const card = document.createElement('div');
        card.id = `hu-${item.hu}`;
        card.className = `hu-card ${item.encontrado ? 'encontrado' : ''}`;
        
        card.innerHTML = `
          <div class="hu-info">
            <div class="hu-codigo">HU: ${item.hu}</div>
            <div class="hu-detalhe"><strong>Bin:</strong> ${item.posicao} | <strong>Mat:</strong> ${item.material}</div>
            <div class="hu-detalhe">${item.descricao}</div>
          </div>
          <div>
            <span class="badge">${item.encontrado ? '✓ OK' : 'Pendente'}</span>
          </div>
        `;

        container.appendChild(card);
      });

      const total = listaHUs.length;
      const pct = total > 0 ? Math.round((encontrados / total) * 100) : 0;
      document.getElementById('progresso-texto').innerText = `${encontrados} de ${total} encontrados (${pct}%)`;
      document.getElementById('progress-bar').style.width = `${pct}%`;
    }

    // 3. Ao bipar a HU
    async function onScanSuccess(decodedText) {
      if (aguardandoProcessamento) return;

      const codigoLido = decodedText.replace(/[\(\)\s]/g, '');
      const itemExistente = listaHUs.find(i => i.hu === codigoLido);

      if (navigator.vibrate) navigator.vibrate(150);

      if (!itemExistente) {
        mostrarFeedback(`HU ${codigoLido} não pertence a esta lista!`, false);
        return;
      }

      if (itemExistente.encontrado) {
        mostrarFeedback(`HU ${codigoLido} já foi bipada!`, false);
        return;
      }

      aguardandoProcessamento = true;

      // Atualização imediata no frontend (Verde)
      itemExistente.encontrado = true;
      renderizarLista();
      
      const elementoHU = document.getElementById(`hu-${codigoLido}`);
      if (elementoHU) elementoHU.scrollIntoView({ behavior: 'smooth', block: 'center' });

      mostrarFeedback(`HU ${codigoLido} ENCONTRADA!`, true);

      // Envia atualização para a API do Apps Script
      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=bipar&hu=${encodeURIComponent(codigoLido)}`);
        const res = await response.json();
        
        if (!res.sucesso) {
          mostrarFeedback(`Erro na gravação: ${res.mensagem}`, false);
        }
      } catch (err) {
        mostrarFeedback("Erro ao sincronizar com a planilha.", false);
      } finally {
        aguardandoProcessamento = false;
      }
    }

    function mostrarFeedback(texto, sucesso) {
      const fb = document.getElementById('feedback');
      fb.innerText = texto;
      fb.className = sucesso ? 'sucesso' : 'erro';
      fb.style.display = 'block';

      setTimeout(() => { fb.style.display = 'none'; }, 3500);
    }

    async function iniciarCamera() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 20, qrbox: { width: 280, height: 140 } };

      try {
        await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, () => {});
      } catch (err) {
        mostrarFeedback("Erro ao acessar a câmera.", false);
      }
    }

    window.addEventListener('DOMContentLoaded', carregarDados);
  </script>
</body>
</html>
