<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor Rápido SSCC (GS1-128)</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
    #reader { width: 100%; max-width: 500px; margin: auto; border-radius: 12px; overflow: hidden; }
    #result { margin-top: 20px; font-size: 1.2rem; font-weight: bold; color: #2e7d32; word-break: break-all; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; }
  </style>
</head>
<body>

  <h2>Leitor de Código SSCC / GS1</h2>
  <div id="reader"></div>
  
  <div class="card" style="margin-top: 20px;">
    <span>Último Código Lido:</span>
    <div id="result">Aguardando leitura...</div>
  </div>

  <script>
    // Regex para validar o padrão (00) + 18 dígitos ou apenas 00 + 18 dígitos
    const ssccRegex = /(?:^\(00\)|^00)(\d{18})$/;

    function onScanSuccess(decodedText) {
      // Limpa caracteres especiais do retorno se houver
      const cleanText = decodedText.replace(/\s+/g, '');
      
      // Valida se é o código esperado de 18 dígitos do GS1 (00)
      const match = cleanText.match(ssccRegex);
      
      if (match) {
        const codigoFormatado = `(00)${match[1]}`;
        document.getElementById('result').innerText = codigoFormatado;
        
        // Feedback sonoro/vibratório de leitura rápida
        if (navigator.vibrate) navigator.vibrate(100);
      }
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", 
      { 
        fps: 30, // 30 quadros por segundo para leitura ultra-rápida
        qrbox: { width: 350, height: 150 }, // Caixa retangular ideal para códigos de barras longos
        experimentalFeatures: { useBarCodeDetectorIfSupported: true } // Ativa aceleração de hardware nativa
      },
      /* verbose= */ false
    );

    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
