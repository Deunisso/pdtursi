<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HUD Sci-Fi SSCC Scanner</title>

  <!-- Leitor de Código de Barras -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <!-- IA para Reconhecimento de Texto -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; font-family: 'Courier New', Courier, monospace, system-ui; height: 100vh; width: 100vw; overflow: hidden; color: #fff; }

    #container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* Canvas invisível para IA */
    #crop-canvas { display: none; }

    /* --- MIRA ESTILO IRON MAN --- */
    .viewport-guide {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 92%;
      max-width: 420px;
      height: 120px;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.5), inset 0 0 15px rgba(0, 255, 204, 0.2);
      pointer-events: none;
      z-index: 5;
    }

    /* Detalhes nos cantos do visor estilo HUD */
    .viewport-guide::before, .viewport-guide::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: #ff0055;
      border-style: solid;
    }
    .viewport-guide::before { top: -6px; left: -6px; border-width: 3px 0 0 3px; }
    .viewport-guide::after { bottom: -6px; right: -6px; border-width: 0 3px 3px 0; }

    .laser {
      position: absolute;
      width: 100%;
      height: 2px;
      background: #00ffcc;
      box-shadow: 0 0 12px #00ffcc;
      top: 50%;
      animation: scan 1.2s infinite ease-in-out;
    }

    @keyframes scan {
      0%, 100% { top: 10%; opacity: 0.3; }
      50% { top: 90%; opacity: 1; }
    }

    /* --- PAINEL FLUTUANTE HUD (LOGO ABAIXO DO VISOR) --- */
    #hud-display {
      position: absolute;
      top: calc(42% + 75px); /* Posicionado exatamente abaixo da caixa de mira */
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: rgba(0, 20, 30, 0.85);
      border: 1px solid #00ffcc;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      z-index: 10;
      backdrop-filter: blur(5px);
    }

    .hud-title {
      font-size: 0.7rem;
      color: #00ffcc;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .hud-code {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
      letter-spacing: 2px;
      word-break: break-all;
      margin: 6px 0;
      font-family: monospace;
    }

    .hud-status {
      font-size: 0.75rem;
      color: #ffeb3b;
      font-weight: bold;
    }

    /* Efeito de flash verde no número quando detecta */
    .detected-pulse {
      animation: pulseGreen 0.5s ease-in-out;
    }

    @keyframes pulseGreen {
      0% { transform: scale(1); text-shadow: 0 0 10px #00ffcc; }
      50% { transform: scale(1.05); text-shadow: 0 0 30px #00ff00, 0 0 50px #00ff00; color: #00ff00; }
      100% { transform: scale(1); text-shadow: 0 0 10px #00ffcc; }
    }
  </style>
</head>
<body>

  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="crop-canvas"></canvas>
    
    <!-- Visor de Mira -->
    <div class="viewport-guide" id="guide">
      <div class="laser"></div>
    </div>

    <!-- HUD Flutuante Estilo Iron Man -->
    <div id="hud-display">
      <div class="hud-title">
        <span>[ TARGET_DATA ]</span>
        <span id="engine-tag">INIT...</span>
      </div>
      <div id="result-text" class="hud-code">(00)------------------</div>
      <div id="status-text" class="hud-status">⚡ AGUARDANDO ALVO...</div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const cropCanvas = document.getElementById('crop-canvas');
    const guide = document.getElementById('guide');
    const statusText = document.getElementById('status-text');
    const resultText = document.getElementById('result-text');
    const engineTag = document.getElementById('engine-tag');
    const hudDisplay = document.getElementById('hud-display');

    let barcodeDetector = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['code_128'] }) : null;
    let ocrWorker = null;
    let isProcessingOcr = false;
    let lastFoundCode = "";

    async function initOCR() {
      engineTag.innerText = "IA_LOADING";
      ocrWorker = await Tesseract.createWorker('eng');
      await ocrWorker.setParameters({
        tessedit_char_whitelist: '0123456789()',
      });
      engineTag.innerText = "HYBRID_SYSTEM_ONLINE";
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });

        video.srcObject = stream;
        await video.play();

        // Zoom do Hardware
        const track = stream.getVideoTracks()[0];
        if (track && track.getCapabilities) {
          const capabilities = track.getCapabilities();
          if (capabilities.zoom) {
            const targetZoom = Math.min(1.8, capabilities.zoom.max);
            track.applyConstraints({ advanced: [{ zoom: targetZoom }] }).catch(() => {});
          }
        }

        await initOCR();
        statusText.innerText = "🔍 ESCANEANDO ALVO...";

        scanLoop();
        setInterval(ocrFallbackLoop, 350);

      } catch (err) {
        console.error("Erro na câmera:", err);
        statusText.innerText = "❌ ERRO: SEM ACESSO À CÂMERA";
      }
    }

    // Leitura por código de barras
    async function scanLoop() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && barcodeDetector) {
        try {
          const barcodes = await barcodeDetector.detect(video);
          if (barcodes.length > 0) {
            for (const barcode of barcodes) {
              validateAndSetResult(barcode.rawValue, "BARRAS");
            }
          }
        } catch (e) {}
      }
      requestAnimationFrame(scanLoop);
    }

    // Leitura por IA
    async function ocrFallbackLoop() {
      if (!ocrWorker || isProcessingOcr || video.readyState !== video.HAVE_ENOUGH_DATA) return;

      isProcessingOcr = true;

      try {
        const videoRect = video.getBoundingClientRect();
        const guideRect = guide.getBoundingClientRect();

        const scaleX = video.videoWidth / videoRect.width;
        const scaleY = video.videoHeight / videoRect.height;

        const cropX = (guideRect.left - videoRect.left) * scaleX;
        const cropY = (guideRect.top - videoRect.top) * scaleY;
        const cropW = guideRect.width * scaleX;
        const cropH = guideRect.height * scaleY;

        const maxOcrWidth = 600;
        const ocrScale = Math.min(1, maxOcrWidth / cropW);
        
        cropCanvas.width = cropW * ocrScale;
        cropCanvas.height = cropH * ocrScale;

        const ctx = cropCanvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropCanvas.width, cropCanvas.height);

        // Binarização
        const imgData = ctx.getImageData(0, 0, cropCanvas.width, cropCanvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
          const v = avg > 110 ? 255 : 0;
          data[i] = v; data[i + 1] = v; data[i + 2] = v;
        }
        ctx.putImageData(imgData, 0, 0);

        const { data: { text } } = await ocrWorker.recognize(cropCanvas);
        
        if (text) {
          validateAndSetResult(text, "IA / OCR");
        }
      } catch (err) {
        console.log("Erro OCR:", err);
      } finally {
        isProcessingOcr = false;
      }
    }

    // Validação e exibição
    function validateAndSetResult(rawText, metodoUsado) {
      const clean = rawText.replace(/\s+/g, '');
      const match = clean.match(/\d{18}/);

      if (match) {
        const codigoFormatado = `(00)${match[0]}`;

        if (lastFoundCode !== codigoFormatado) {
          lastFoundCode = codigoFormatado;
          resultText.innerText = codigoFormatado;
          statusText.innerText = `✅ DETECTADO VIA: ${metodoUsado}`;
          statusText.style.color = "#00ffcc";

          // Efeito de pulso futurista no número lido
          resultText.classList.remove('detected-pulse');
          void resultText.offsetWidth; // Trigger reflow
          resultText.classList.add('detected-pulse');

          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }
      }
    }

    window.addEventListener('load', initCamera);
  </script>
</body>
</html>
