<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMS - Leitor de HU (OCR)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #1e1e2d; color: #fff; margin: 0; padding: 15px; }
    h1 { font-size: 20px; margin-bottom: 10px; color: #00d2ff; }
    
    /* Painel de Contagem */
    #dashboard { display: flex; justify-content: space-around; max-width: 500px; margin: 0 auto 15px auto; gap: 10px; }
    .card { background: #2b2b40; padding: 15px; border-radius: 10px; flex: 1; box-shadow: 0 4px 8px rgba(0,0,0,0.3); border-bottom: 4px solid #333; }
    .card.found { border-color: #00e676; }
    .card.missing { border-color: #ff5252; }
    .card p { margin: 0; font-size: 14px; color: #aaa; text-transform: uppercase; font-weight: bold; }
    .card h2 { margin: 5px 0 0 0; font-size: 32px; }
    .found h2 { color: #00e676; }
    .missing h2 { color: #ff5252; }

    /* Câmera */
    #video-container { position: relative; max-width: 450px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 3px solid #444; background: #000; }
    video { width: 100%; display: block; }
    .mira { position: absolute; top: 35%; left: 10%; width: 80%; height: 30%; border: 2px dashed #00d2ff; box-shadow: 0 0 0 999px rgba(0,0,0,0.6); pointer-events: none; }
    #status-ocr { margin-top: 10px; font-size: 14px; color: #ffd700; min-height: 20px; font-weight: 500; }

    /* PING DE ALERTA (Quando acha uma HU) */
    #ping-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 230, 118, 0.95); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; color: #000; animation: flash 0.3s; }
    #ping-overlay h1 { font-size: 40px; color: #000; margin: 0; font-weight: 900; }
    #ping-overlay p { font-size: 24px; margin: 10px 0; font-weight: bold; }
    #ping-hu { background: #000; color: #00e676; padding: 10px 20px; border-radius: 8px; font-size: 28px; font-family: monospace; letter-spacing: 2px; margin-top: 15px; }
    @keyframes flash { from { opacity: 0; transform: scale(1.1); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>

  <h1>🔍 LEITOR DE ESTOQUE HU (OCR)</h1>

  <!-- Painel HUs -->
  <div id="dashboard">
    <div class="card found">
      <p>Encontradas</p>
      <h2 id="qtd-encontradas">-</h2>
    </div>
    <div class="card missing">
      <p>Faltam</p>
      <h2 id="qtd-faltam">-</h2>
    </div>
  </div>

  <!-- Câmera e Mira -->
  <div id="video-container">
    <video id="webcam" autoplay playsinline></video>
    <div class="mira"></div>
  </div>
  
  <p id="status-ocr">⏳ Inicializando Inteligência OCR...</p>

  <!-- PING DE ALERTA -->
  <div id="ping-overlay">
    <h1>🚨 HU ENCONTRADA! 🚨</h1>
    <p>Baixa registrada no Google Sheets!</p>
    <div id="ping-hu">000000000000000000</div>
  </div>

  <script>
    // =================================================================
    // ⚠️ COLOQUE AQUI A URL QUE VOCÊ COPIOU DO GOOGLE APPS SCRIPT:
    const SCRIPT_URL = "COLE_SUA_URL_DO_APPS_SCRIPT_AQUI";
    // =================================================================

    const video = document.getElementById('webcam');
    const statusOcr = document.getElementById('status-ocr');
    let ocrAtivo = false;
    let processandoHU = false;

    // 1. Efeito Sonoro (Bip sem precisar de arquivos externos)
    function tocarBip() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime); // Nota A5
        osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch(e) {}
    }

    // 2. Atualizar Contadores em Tempo Real da Planilha
    async function atualizarDashboard() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        document.getElementById('qtd-encontradas').innerText = data.encontradas;
        document.getElementById('qtd-faltam').innerText = data.pendentes;
      } catch (e) {
        console.log("Aguardando conexão com planilha...");
      }
    }

    // 3. Inicializar Câmera Traseira
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } })
      .then(stream => {
        video.srcObject = stream;
        iniciarOCR();
      })
      .catch(err => {
        statusOcr.innerText = "❌ Erro na câmera. Permita o acesso no navegador.";
        statusOcr.style.color = "#ff5252";
      });

    // 4. Motor OCR (Tesseract) configurado para SÓ LER NÚMEROS
    async function iniciarOCR() {
      statusOcr.innerText = "⚡ Carregando motor OCR de números...";
      
      const worker = await Tesseract.createWorker('eng');
      // TRUQUE: Restringir o OCR apenas para algarismos numéricos (evita ler letras erradas)
      await worker.setParameters({
        tessedit_char_whitelist: '0123456789',
      });

      statusOcr.innerText = "🟢 Câmera Pronta! Aponte para os 18 dígitos da etiqueta.";
      ocrAtivo = true;

      // Executa a leitura a cada 1.5 segundos
      setInterval(async () => {
        if (!ocrAtivo || processandoHU) return;

        // Recorta apenas a área central da mira para o OCR ser 5x mais rápido
        const canvas = document.createElement('canvas');
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        
        canvas.width = vw * 0.8;
        canvas.height = vh * 0.3;
        const ctx = canvas.getContext('2d');
        
        // Desenha só o miolo (onde a mira azul está posicionada)
        ctx.drawImage(video, vw * 0.1, vh * 0.35, vw * 0.8, vh * 0.3, 0, 0, canvas.width, canvas.height);

        const { data: { text } } = await worker.recognize(canvas);
        
        // Limpa espaços e quebras de linha e busca exatamente 18 números seguidos
        const textoLimpo = text.replace(/\D/g, '');
        const match = textoLimpo.match(/\d{18}/);

        if (match) {
          const huEncontrada = match[0];
          statusOcr.innerText = `⏳ Lendo HU: ${huEncontrada}...`;
          verificarHU(huEncontrada);
        }
      }, 1500);
    }

    // 5. Enviar HU para a Planilha e disparar o PING
    async function verificarHU(hu) {
      processandoHU = true;
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ hu: hu })
        });
        const data = await res.json();

        if (data.status === "sucesso") {
          tocarBip();
          
          // ATIVA O PING NA TELA PARA A EQUIPE!
          const ping = document.getElementById('ping-overlay');
          document.getElementById('ping-hu').innerText = hu;
          ping.style.display = 'flex';
          
          atualizarDashboard();

          // Esconde o Ping depois de 3.5 segundos e volta a ler
          setTimeout(() => {
            ping.style.display = 'none';
            statusOcr.innerText = "🟢 Câmera Pronta! Aponte para a próxima etiqueta.";
            processandoHU = false;
          }, 3500);

        } else if (data.status === "ja_lido") {
          statusOcr.innerText = `⚠️ A HU ${hu} JÁ FOI REGISTRADA ANTES!`;
          statusOcr.style.color = "#ff9800";
          setTimeout(() => { 
            statusOcr.innerText = "🟢 Câmera Pronta!"; 
            statusOcr.style.color = "#ffd700";
            processandoHU = false; 
          }, 2500);
        } else {
          statusOcr.innerText = `❌ HU ${hu} não pertence à lista desta planilha.`;
          statusOcr.style.color = "#ff5252";
          setTimeout(() => { 
            statusOcr.innerText = "🟢 Câmera Pronta!"; 
            statusOcr.style.color = "#ffd700";
            processandoHU = false; 
          }, 2500);
        }
      } catch (e) {
        statusOcr.innerText = "Erro de conexão com o Google Sheets.";
        processandoHU = false;
      }
    }

    // Atualiza os contadores ao abrir e a cada 4 segundos (para sincronizar entre celulares)
    atualizarDashboard();
    setInterval(atualizarDashboard, 4000);
  </script>
</body>
</html>
