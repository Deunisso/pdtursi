<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 10px; }
    video { width: 100%; max-width: 500px; height: auto; border: 2px solid #ccc; border-radius: 8px; }
    #resultado { font-size: 1.2em; font-weight: bold; margin-top: 10px; color: #007bff; }
    button { padding: 10px 20px; font-size: 1em; margin-bottom: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Leitor de Câmera Direct-Stream</h2>
  <button onclick="iniciarCâmera()">Abrir / Trocar Câmera</button><br>
  
  <video id="video"></video>
  <div id="resultado">Aguardando ação...</div>

  <script>
    const codeReader = new ZXing.BrowserMultiFormatReader();
    let selectedDeviceId;

    async function iniciarCâmera() {
      try {
        const videoInputDevices = await codeReader.listVideoInputDevices();
        
        // Seleciona a câmera traseira se disponível
        selectedDeviceId = videoInputDevices.length > 1 ? videoInputDevices[1].deviceId : videoInputDevices[0].deviceId;

        document.getElementById('resultado').innerText = "Câmera ativa. Aponte para a HU.";

        codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
          if (result) {
            navigator.vibrate?.(200);
            document.getElementById('resultado').innerText = "HU Lida: " + result.text;
            
            // Envia para o Google Sheets
            google.script.run
              .withSuccessHandler((msg) => alert(msg))
              .registrarLeitura(result.text);

            // Pausa temporária após leitura
            codeReader.reset();
            setTimeout(() => iniciarCâmera(), 3000);
          }
        });
      } catch (err) {
        document.getElementById('resultado').innerText = "Erro de Permissão: Acesse as configurações do seu navegador e permita o uso da câmera para este site.";
        console.error(err);
      }
    }
  </script>
</body>
</html>
