<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PDTursi - Scanner WMS</title>
  
  <!-- Biblioteca Tesseract para OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Câmera em Tela Cheia -->
    <div id="video-container">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="canvas-processamento"></canvas>
    </div>

    <!-- Canto Superior Esquerdo: Status da Leitura com Borda Neon -->
    <div id="modo-leitura" class="status-escaneando">ESCANEANDO...</div>

    <!-- Canto Superior Direito: Quantidades Restantes -->
    <div class="contador-box">
      <span id="contador-digitos">0 RESTANTES</span>
    </div>

    <!-- Elementos ocultos/invisíveis usados pelo JavaScript (para evitar erros de referência) -->
    <div class="visor-numeros" style="display: none;">
      <span id="nums-estabilizados"></span>
      <span id="nums-ativos"></span>
    </div>

    <!-- Painel Inferior: HUs Pendentes -->
    <div id="painel-pendentes">
      <div class="pendentes-header">
        <span>⌛ HUS PENDENTES</span>
      </div>
      <div id="container-lista-hus" class="lista-hus">
        <!-- Chips das HUs serão gerados dinamicamente via JS -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
