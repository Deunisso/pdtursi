<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HUD Sci-Fi SSCC Scanner Preciso</title>

  <!-- Leitor de Código de Barras -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <!-- IA para Reconhecimento de Texto -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; font-family: 'Courier New', Courier, monospace, system-ui; height: 100vh; width: 100vw; overflow: hidden; color: #fff; }

    #container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* Canvas invisível para IA */
    #crop-canvas { display: none; }

    /* --- MIRA AJUSTADA --- */
    .viewport-guide {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 92%;
      max-width: 420px;
      height: 120px;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.5), inset 0 0 15px rgba(0, 255, 204, 0.2);
      pointer-events: none;
      z-index: 5;
    }

    .viewport-guide::before, .viewport-guide::after {
      content: ''; position: absolute; width: 20px; height: 20px; border-color: #ff0055; border-style: solid;
    }
    .viewport-guide::before { top: -6px; left: -6px; border-width: 3px 0 0 3px; }
    .viewport-guide::after { bottom: -6px; right: -6px; border-width: 0 3px 3px 0; }

    .laser {
      position: absolute; width: 100%; height: 2px; background: #00ffcc; box-shadow: 0 0 12px #00ffcc; top: 50%; animation: scan 1.2s infinite ease-in-out;
    }

    @keyframes scan {
      0%, 100% { top: 10%; opacity: 0.3; }
      50% { top: 90%; opacity: 1; }
    }

    /* --- PAINEL FLUTUANTE HUD --- */
    #hud-display {
      position: absolute;
      top: calc(40% + 75px);
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: rgba(0, 20, 30, 0.9);
      border: 1px solid #00ffcc;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      z-index: 10;
      backdrop-filter: blur(5px);
    }

    .hud-title {
      font-size: 0.7rem; color: #00ffcc; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; display: flex; justify-content: space-between;
    }

    .hud-code {
      font-size: 1.45rem; font-weight: bold; color: #ffffff; text-shadow: 0 0 10px #00ffcc; letter-spacing: 1px; word-break: break-all; margin: 6px 0; font-family: monospace;
    }

    .hud-status { font-size: 0.75rem; color: #ffeb3b; font-weight: bold; }

    .detected-pulse { animation: pulseGreen 0.5s ease-in-out; }

    @keyframes pulseGreen {
      0% { transform: scale(1); text-shadow: 0 0 10px #00ffcc; }
      50% { transform: scale(1.05); text-shadow: 0 0 30px #00ff00; color: #00ff00; }
      100% { transform: scale(1); text-shadow: 0 0 10px #00ffcc; }
    }
  </style>
</head>
<body>

  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="crop-canvas"></canvas>
    
    <div class="viewport-guide" id="guide">
      <div class="laser"></div>
    </div>

    <div id="hud-display">
      <div class="hud-title">
        <span>[ TARGET_DATA ]</span>
        <span id="engine-tag">INIT...</span>
      </div>
      <div id="result-text" class="hud-code">(00)------------------</div>
      <div id="status-text" class="hud-status">⚡ AGUARDANDO ALVO...</div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const cropCanvas = document.getElementById('crop-canvas');
    const guide = document.getElementById('guide');
    const statusText = document.getElementById('status-text');
    const resultText = document.getElementById('result-text');
    const engineTag = document.getElementById('engine-tag');

    let barcodeDetector = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['code_128'] }) : null;
    let ocrWorker = null;
    let isProcessingOcr = false;
    let lastFoundCode = "";

    // Validador de Dígito de Controle GS1 / SSCC
    function isValidGS1Checksum(digits18) {
      if (digits18.length !== 18) return false;
      let sum = 0;
      for (let i = 0; i < 17; i++) {
        let val = parseInt(digits18[i], 10);
        sum += (i % 2 === 0) ? val * 3 : val;
      }
      let checkDigit = (10 - (sum % 10)) % 10;
      return checkDigit === parseInt(digits18[17], 10);
    }

    async function initOCR() {
      engineTag.innerText = "IA_PRECISION_MODE";
      ocrWorker = await Tesseract.createWorker('eng');
      await ocrWorker.setParameters({
        tessedit_char_whitelist: '0123456789()',
        tessedit_pageseg_mode: '7', // Trata a imagem como uma linha única de texto
      });
      engineTag.innerText = "HIGH_ACCURACY_ONLINE";
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });

        video.srcObject = stream;
        await video.play();

        const track = stream.getVideoTracks()[0];
        if (track && track.getCapabilities) {
          const capabilities = track.getCapabilities();
          if (capabilities.zoom) {
            const targetZoom = Math.min(1.5, capabilities.zoom.max);
            track.applyConstraints({ advanced: [{ zoom: targetZoom }] }).catch(() => {});
          }
        }

        await initOCR();
        statusText.innerText = "🔍 POSICIONE OS NÚMEROS NA MIRA";

        scanLoop();
        setInterval(ocrFallbackLoop, 400);

      } catch (err) {
        console.error("Erro na câmera:", err);
        statusText.innerText = "❌ ERRO: SEM ACESSO À CÂMERA";
      }
    }

    // Leitura por código de barras
    async function scanLoop() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && barcodeDetector) {
        try {
          const barcodes = await barcodeDetector.detect(video);
          if (barcodes.length > 0) {
            for (const barcode of barcodes) {
              validateAndSetResult(barcode.rawValue, "CÓDIGO DE BARRAS");
            }
          }
        } catch (e) {}
      }
      requestAnimationFrame(scanLoop);
    }

    // Leitura por IA Focada Apenas na Linha Numérica
    async function ocrFallbackLoop() {
      if (!ocrWorker || isProcessingOcr || video.readyState !== video.HAVE_ENOUGH_DATA) return;

      isProcessingOcr = true;

      try {
        const videoRect = video.getBoundingClientRect();
        const guideRect = guide.getBoundingClientRect();

        const scaleX = video.videoWidth / videoRect.width;
        const scaleY = video.videoHeight / videoRect.height;

        // Foca APENAS na parte inferior da mira (onde estão os números impresso abaixo das barras)
        const cropX = (guideRect.left - videoRect.left) * scaleX;
        const cropY = (guideRect.top - videoRect.top + (guideRect.height * 0.55)) * scaleY;
        const cropW = guideRect.width * scaleX;
        const cropH = (guideRect.height * 0.45) * scaleY;

        cropCanvas.width = cropW;
        cropCanvas.height = cropH;

        const ctx = cropCanvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

        // Suavização e ganho de contraste mantendo a nitidez
        const imgData = ctx.getImageData(0, 0, cropW, cropH);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          let grayscale = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
          // Contraste suave
          grayscale = grayscale < 120 ? grayscale * 0.5 : Math.min(255, grayscale * 1.3);
          data[i] = grayscale; data[i + 1] = grayscale; data[i + 2] = grayscale;
        }
        ctx.putImageData(imgData, 0, 0);

        const { data: { text } } = await ocrWorker.recognize(cropCanvas);
        
        if (text) {
          validateAndSetResult(text, "IA / OCR (TEXTO)");
        }
      } catch (err) {
        console.log("Erro OCR:", err);
      } finally {
        isProcessingOcr = false;
      }
    }

    // Validação estrita
    function validateAndSetResult(rawText, metodoUsado) {
      const clean = rawText.replace(/[^\d]/g, ''); // Remove tudo que não for dígito
      
      // Procura qualquer sequência contínua de 18 dígitos
      const matches = clean.match(/\d{18}/g);

      if (matches) {
        for (const digits of matches) {
          // Checa se o código atende ao cálculo do dígito GS1
          const isValid = isValidGS1Checksum(digits);

          // Se for via código de barras ou se passar no Checksum do OCR
          if (metodoUsado === "CÓDIGO DE BARRAS" || isValid) {
            const codigoFormatado = `(00)${digits}`;

            if (lastFoundCode !== codigoFormatado) {
              lastFoundCode = codigoFormatado;
              resultText.innerText = codigoFormatado;
              statusText.innerText = `✅ DETECTADO VIA: ${metodoUsado}`;
              statusText.style.color = "#00ffcc";

              resultText.classList.remove('detected-pulse');
              void resultText.offsetWidth;
              resultText.classList.add('detected-pulse');

              if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            }
            break;
          }
        }
      }
    }

    window.addEventListener('load', initCamera);
  </script>
</body>
</html>
