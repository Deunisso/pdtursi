<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PDTursi - Scanner WMS</title>
  
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <div id="video-container">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="canvas-processamento"></canvas>

      <!-- Status Esquerda -->
      <div id="modo-leitura" class="status-escaneando">ESCANEANDO...</div>

      <!-- 🌟 POPUP CENTRALIZADO (NUMERO LIDO) -->
      <div id="popup-leitura" class="popup-hu-centro">---</div>

      <!-- Status Direita -->
      <div class="contador-box">
        <span id="contador-digitos">0 RESTANTES</span>
      </div>

      <!-- Log Terminal (Inicia oculto) -->
      <div id="log-terminal" class="terminal-box oculto">
        <div class="terminal-header">STATUS DA CONEXÃO</div>
        <div id="log-mensagens" class="terminal-body"></div>
      </div>

      <!-- 🔻 PAINEL DE HUS PENDENTES (EMBAIXO) -->
      <div id="painel-pendentes">
        <div class="pendentes-header">
          <span>⌛ HUS PENDENTES (DESLIZE ➔)</span>
        </div>
        <div id="container-lista-hus" class="lista-hus">
          <div class="hu-chip">Buscando...</div>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
