<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMS - Leitor de HU (OCR Inteligente)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #12121c; color: #fff; margin: 0; padding: 10px; }
    h1 { font-size: 18px; margin: 5px 0 15px 0; color: #00d2ff; letter-spacing: 1px; }
    
    /* Painel de Contagem */
    #dashboard { display: flex; justify-content: space-around; max-width: 480px; margin: 0 auto 10px auto; gap: 10px; }
    .card { background: #1e1e2d; padding: 10px; border-radius: 8px; flex: 1; box-shadow: 0 4px 8px rgba(0,0,0,0.4); border-bottom: 3px solid #333; }
    .card.found { border-color: #00e676; }
    .card.missing { border-color: #ff5252; }
    .card p { margin: 0; font-size: 12px; color: #aaa; text-transform: uppercase; font-weight: bold; }
    .card h2 { margin: 5px 0 0 0; font-size: 28px; }
    .found h2 { color: #00e676; }
    .missing h2 { color: #ff5252; }

    /* Câmera e Mira */
    #video-container { position: relative; max-width: 480px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 2px solid #333; background: #000; }
    video { width: 100%; display: block; }
    .mira { position: absolute; top: 30%; left: 5%; width: 90%; height: 40%; border: 2px dashed #00d2ff; box-shadow: 0 0 0 999px rgba(0,0,0,0.65); transition: all 0.2s; pointer-events: none; }
    .mira.lendo { border-color: #ffd700; background: rgba(255, 215, 0, 0.05); }
    .mira.sucesso { border-color: #00e676; background: rgba(0, 230, 118, 0.2); }

    /* VISOR AO VIVO (HUD DE LEITURA) */
    #visor-hud { max-width: 480px; margin: 10px auto 0 auto; background: #1a1a26; border: 1px solid #333; border-radius: 8px; padding: 10px; text-align: left; }
    #visor-hud .titulo-hud { font-size: 11px; color: #888; text-transform: uppercase; display: flex; justify-content: space-between; margin-bottom: 4px; }
    #visor-hud .numeros-lidos { font-family: 'Courier New', Courier, monospace; font-size: 20px; font-weight: bold; color: #00e676; letter-spacing: 2px; min-height: 24px; word-break: break-all; }
    #visor-hud .dica-status { font-size: 12px; color: #ffd700; margin-top: 4px; font-style: italic; }

    /* Canvas invisível para processamento de imagem */
    #canvas-processamento { display: none; }

    /* PING DE ALERTA */
    #ping-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 230, 118, 0.96); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; color: #000; animation: flash 0.3s; }
    #ping-overlay h1 { font-size: 36px; color: #000; margin: 0; font-weight: 900; }
    #ping-overlay p { font-size: 20px; margin: 10px 0; font-weight: bold; }
    #ping-hu { background: #000; color: #00e676; padding: 10px 15px; border-radius: 8px; font-size: 24px; font-family: monospace; letter-spacing: 2px; margin-top: 15px; }
    @keyframes flash { from { opacity: 0; transform: scale(1.1); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>

  <h1>🔍 LEITOR DE ESTOQUE HU (OCR)</h1>

  <!-- Painel -->
  <div id="dashboard">
    <div class="card found">
      <p>Encontradas</p>
      <h2 id="qtd-encontradas">-</h2>
    </div>
    <div class="card missing">
      <p>Faltam</p>
      <h2 id="qtd-faltam">-</h2>
    </div>
  </div>

  <!-- Câmera e Mira -->
  <div id="video-container">
    <video id="webcam" autoplay playsinline></video>
    <div id="mira-box" class="mira"></div>
  </div>
  
  <!-- VISOR DE LEITURA EM TEMPO REAL -->
  <div id="visor-hud">
    <div class="titulo-hud">
      <span>Leitura em Tempo Real:</span>
      <span id="contador-digitos">0 / 18 dígitos</span>
    </div>
    <div id="numeros-lidos" class="numeros-lidos">Aguardando números...</div>
    <div id="dica-status" class="dica-status">⏳ Inicializando Inteligência OCR...</div>
  </div>

  <canvas id="canvas-processamento"></canvas>

  <!-- PING DE ALERTA -->
  <div id="ping-overlay">
    <h1>🚨 HU ENCONTRADA! 🚨</h1>
    <p>Baixa registrada no Google Sheets!</p>
    <div id="ping-hu">000000000000000000</div>
  </div>

  <script>
    // =================================================================
    // ⚠️ COLOQUE AQUI A URL QUE VOCÊ COPIOU DO GOOGLE APPS SCRIPT:
    const SCRIPT_URL = "SUA_URL_DO_GOOGLE_APPS_SCRIPT_AQUI";
    // =================================================================

    const video = document.getElementById('webcam');
    const miraBox = document.getElementById('mira-box');
    const numerosLidosEl = document.getElementById('numeros-lidos');
    const contadorDigitosEl = document.getElementById('contador-digitos');
    const dicaStatusEl = document.getElementById('dica-status');
    const canvas = document.getElementById('canvas-processamento');
    
    let ocrAtivo = false;
    let processandoHU = false;
    let workerOCR = null;

    // 1. Efeito Sonoro (Bip)
    function tocarBip() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch(e) {}
    }

    // 2. Atualizar Contadores da Planilha
    async function atualizarDashboard() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        document.getElementById('qtd-encontradas').innerText = data.encontradas;
        document.getElementById('qtd-faltam').innerText = data.pendentes;
      } catch (e) {}
    }

    // 3. Inicializar Câmera Traseira
    navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: "environment", 
        width: { ideal: 1280 }, 
        height: { ideal: 720 },
        focusMode: "continuous"
      } 
    })
    .then(stream => {
      video.srcObject = stream;
      iniciarMotorOCR();
    })
    .catch(err => {
      dicaStatusEl.innerText = "❌ Erro na câmera. Permita o acesso no navegador.";
      dicaStatusEl.style.color = "#ff5252";
    });

    // 4. Inicializar Motor OCR (Tesseract)
    async function iniciarMotorOCR() {
      dicaStatusEl.innerText = "⚡ Carregando inteligência artificial...";
      workerOCR = await Tesseract.createWorker('eng');
      
      // Restringe exclusivamente para números (0-9)
      await workerOCR.setParameters({
        tessedit_char_whitelist: '0123456789',
      });

      dicaStatusEl.innerText = "🟢 Câmera Pronta! Centralize os 18 números na mira azul.";
      dicaStatusEl.style.color = "#00e676";
      ocrAtivo = true;

      // Inicia o Loop Assíncrono (Nunca trava a memória)
      loopLeituraOCR();
    }

    // 5. Loop Inteligente de Leitura
    async function loopLeituraOCR() {
      if (!ocrAtivo || processandoHU) {
        setTimeout(loopLeituraOCR, 500);
        return;
      }

      try {
        miraBox.classList.add('lendo');
        
        // Recorta a área exata da mira (Top 30% a 70%, Left 5% a 95%)
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        if (vw > 0 && vh > 0) {
          canvas.width = vw * 0.9;
          canvas.height = vh * 0.4;
          const ctx = canvas.getContext('2d');
          
          // Captura o quadro
          ctx.drawImage(video, vw * 0.05, vh * 0.30, vw * 0.9, vh * 0.4, 0, 0, canvas.width, canvas.height);

          // TRATAMENTO DE IMAGEM: Aumentar Contraste / Escala de Cinza
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;
          for (let i = 0; i < data.length; i += 4) {
            // Converte para cinza e aplica contraste severo
            let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
            avg = avg < 130 ? 0 : 255; // Binarização (Preto e Branco puro)
            data[i] = avg;     // R
            data[i + 1] = avg; // G
            data[i + 2] = avg; // B
          }
          ctx.putImageData(imgData, 0, 0);

          // Executa OCR no corte otimizado
          const { data: { text } } = await workerOCR.recognize(canvas);
          
          // Extrai apenas sequências de números
          const textoLimpo = text.replace(/\D/g, '');
          
          // Busca a maior sequência de números encontrada no quadro
          if (textoLimpo.length > 0) {
            numerosLidosEl.innerText = textoLimpo;
            contadorDigitosEl.innerText = `${textoLimpo.length} / 18 dígitos`;
            
            if (textoLimpo.length === 18) {
              numerosLidosEl.style.color = "#00e676";
              dicaStatusEl.innerText = "🎯 18 Dígitos detectados! Validando no estoque...";
              dicaStatusEl.style.color = "#00e676";
              miraBox.classList.remove('lendo');
              miraBox.classList.add('sucesso');
              
              await verificarHU(textoLimpo);
            } else if (textoLimpo.length > 18) {
              // Se capturou números a mais, tenta achar os 18 dentro da string
              const match = textoLimpo.match(/\d{18}/);
              if (match) {
                numerosLidosEl.innerText = match[0];
                contadorDigitosEl.innerText = "18 / 18 dígitos";
                await verificarHU(match[0]);
              } else {
                numerosLidosEl.style.color = "#ff9800";
                dicaStatusEl.innerText = "⚠️ Excesso de números. Aproxime a câmera da etiqueta.";
                dicaStatusEl.style.color = "#ff9800";
              }
            } else {
              numerosLidosEl.style.color = "#ffd700";
              dicaStatusEl.innerText = `👁️ Lendo... Faltam ${18 - textoLimpo.length} dígitos para completar.`;
              dicaStatusEl.style.color = "#ffd700";
            }
          } else {
            numerosLidosEl.innerText = "---";
            contadorDigitosEl.innerText = "0 / 18 dígitos";
            numerosLidosEl.style.color = "#666";
          }
        }
        miraBox.classList.remove('lendo');
      } catch (e) {
        console.error("Erro no loop OCR:", e);
      }

      // Chama a próxima leitura instantaneamente após terminar essa (sem travar memória)
      setTimeout(loopLeituraOCR, 200);
    }

    // 6. Validar no Google Sheets e Exibir Alerta
    async function verificarHU(hu) {
      processandoHU = true;
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ hu: hu })
        });
        const data = await res.json();

        if (data.status === "sucesso") {
          tocarBip();
          const ping = document.getElementById('ping-overlay');
          document.getElementById('ping-hu').innerText = hu;
          ping.style.display = 'flex';
          
          atualizarDashboard();

          setTimeout(() => {
            ping.style.display = 'none';
            resetarVisor();
            processandoHU = false;
          }, 3500);

        } else if (data.status === "ja_lido") {
          dicaStatusEl.innerText = `⚠️ A HU ${hu} JÁ FOI REGISTRADA ANTES!`;
          dicaStatusEl.style.color = "#ff9800";
          numerosLidosEl.style.color = "#ff9800";
          setTimeout(() => { resetarVisor(); processandoHU = false; }, 2500);
        } else {
          dicaStatusEl.innerText = `❌ HU ${hu} não encontrada na lista da planilha!`;
          dicaStatusEl.style.color = "#ff5252";
          numerosLidosEl.style.color = "#ff5252";
          setTimeout(() => { resetarVisor(); processandoHU = false; }, 2500);
        }
      } catch (e) {
        dicaStatusEl.innerText = "❌ Erro de conexão com a planilha do Google.";
        dicaStatusEl.style.color = "#ff5252";
        setTimeout(() => { resetarVisor(); processandoHU = false; }, 2500);
      }
    }

    function resetarVisor() {
      miraBox.classList.remove('sucesso');
      numerosLidosEl.innerText = "Aguardando números...";
      numerosLidosEl.style.color = "#00e676";
      contadorDigitosEl.innerText = "0 / 18 dígitos";
      dicaStatusEl.innerText = "🟢 Câmera Pronta! Centralize os 18 números na mira azul.";
      dicaStatusEl.style.color = "#00e676";
    }

    // Sincroniza o painel com a planilha a cada 5 segundos
    atualizarDashboard();
    setInterval(atualizarDashboard, 5000);
  </script>
</body>
</html>
