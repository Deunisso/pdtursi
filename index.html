<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WMS - Leitor de HU</title>
  <!-- Motores de Leitura: OCR (Tesseract) + Barcode (ZXing) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { width: 100%; height: 100vh; overflow: hidden; background: #0f0f15; color: #fff; }
    
    /* Layout Container Fixo (Sem rolagem) */
    .app-container { display: flex; flex-direction: column; height: 100vh; padding: 8px; justify-content: space-between; }

    /* Topo: Painel Slim */
    #dashboard { display: flex; justify-content: space-between; gap: 8px; height: 65px; }
    .card { background: #1a1a24; border-radius: 8px; flex: 1; padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-bottom: 3px solid #333; }
    .card.found { border-color: #00e676; }
    .card.missing { border-color: #ff5252; }
    .card p { font-size: 10px; color: #aaa; text-transform: uppercase; font-weight: bold; }
    .card h2 { font-size: 22px; margin-top: 2px; }
    .found h2 { color: #00e676; }
    .missing h2 { color: #ff5252; }

    /* Câmera Central (Ocupa o resto da tela) */
    #video-container { position: relative; flex: 1; margin: 8px 0; border-radius: 12px; overflow: hidden; border: 2px solid #2a2a3a; background: #000; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* MIRA COM LEITURA DENTRO DO VISOR */
    .mira { position: absolute; top: 20%; left: 5%; width: 90%; height: 60%; border: 2px dashed #00d2ff; box-shadow: 0 0 0 999px rgba(0,0,0,0.65); border-radius: 8px; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; transition: border-color 0.2s, background 0.2s; }
    .mira.lendo { border-color: #ffd700; }
    .mira.sucesso { border-color: #00e676; background: rgba(0, 230, 118, 0.25); }

    /* Textos DENTRO do Visor */
    .visor-topo { display: flex; justify-content: space-between; font-size: 11px; color: #00d2ff; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .visor-numeros { font-family: 'Courier New', monospace; font-size: 18px; font-weight: 900; color: #00e676; text-align: center; letter-spacing: 1.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.9); background: rgba(0,0,0,0.6); padding: 6px; border-radius: 6px; word-break: break-all; }
    .visor-status { font-size: 11px; color: #ffd700; text-align: center; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.9); background: rgba(0,0,0,0.5); padding: 3px; border-radius: 4px; }

    /* Canvas Escondido */
    #canvas-processamento { display: none; }

    /* PING DE ALERTA */
    #ping-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 230, 118, 0.96); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; color: #000; animation: flash 0.2s; }
    #ping-overlay h1 { font-size: 32px; color: #000; margin: 0; font-weight: 900; }
    #ping-overlay p { font-size: 18px; margin: 8px 0; font-weight: bold; }
    #ping-hu { background: #000; color: #00e676; padding: 8px 16px; border-radius: 8px; font-size: 22px; font-family: monospace; letter-spacing: 2px; }
    @keyframes flash { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Topo Slim -->
    <div id="dashboard">
      <div class="card found">
        <p>Encontradas</p>
        <h2 id="qtd-encontradas">-</h2>
      </div>
      <div class="card missing">
        <p>Faltam</p>
        <h2 id="qtd-faltam">-</h2>
      </div>
    </div>

    <!-- Câmera com Visor Interno -->
    <div id="video-container">
      <video id="webcam" autoplay playsinline></video>
      
      <!-- Mira com visor tudo dentro -->
      <div id="mira-box" class="mira">
        <div class="visor-topo">
          <span>PADRÃO HU (SSCC)</span>
          <span id="contador-digitos">0 / 18</span>
        </div>
        <div id="numeros-lidos" class="visor-numeros">Aguardando...</div>
        <div id="dica-status" class="visor-status">Iniciando câmera...</div>
      </div>
    </div>
  </div>

  <canvas id="canvas-processamento"></canvas>

  <!-- PING DE ALERTA -->
  <div id="ping-overlay">
    <h1>🚨 HU ENCONTRADA! 🚨</h1>
    <p>Baixa Registrada!</p>
    <div id="ping-hu">000000000000000000</div>
  </div>

  <script>
    // =================================================================
    // ⚠️ COLOQUE AQUI A SUA URL DO GOOGLE APPS SCRIPT:
    const SCRIPT_URL = "SUA_URL_DO_GOOGLE_APPS_SCRIPT_AQUI";
    // =================================================================

    const video = document.getElementById('webcam');
    const miraBox = document.getElementById('mira-box');
    const numerosLidosEl = document.getElementById('numeros-lidos');
    const contadorDigitosEl = document.getElementById('contador-digitos');
    const dicaStatusEl = document.getElementById('dica-status');
    const canvas = document.getElementById('canvas-processamento');

    let ocrAtivo = false;
    let processandoHU = false;
    let workerOCR = null;
    let barcodeReader = null;

    // Bip sonoro
    function tocarBip() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch(e) {}
    }

    // Dashboard
    async function atualizarDashboard() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        document.getElementById('qtd-encontradas').innerText = data.encontradas;
        document.getElementById('qtd-faltam').innerText = data.pendentes;
      } catch (e) {}
    }

    // Iniciar Câmera e Leitores
    navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: "environment", 
        width: { ideal: 1920 }, // Alta resolução para ler de longe
        height: { ideal: 1080 },
        focusMode: "continuous"
      } 
    })
    .then(stream => {
      video.srcObject = stream;
      iniciarMotores();
    })
    .catch(err => {
      dicaStatusEl.innerText = "❌ Permita o acesso à câmera.";
      dicaStatusEl.style.color = "#ff5252";
    });

    async function iniciarMotores() {
      dicaStatusEl.innerText = "⚡ Carregando IA...";
      
      // 1. Barcode Reader (ZXing)
      barcodeReader = new ZXing.BrowserMultiFormatReader();

      // 2. OCR (Tesseract)
      workerOCR = await Tesseract.createWorker('eng');
      await workerOCR.setParameters({
        tessedit_char_whitelist: '0123456789',
      });

      dicaStatusEl.innerText = "🟢 Enquadre a etiqueta no visor";
      dicaStatusEl.style.color = "#00e676";
      ocrAtivo = true;

      loopLeituraHibrida();
    }

    // LOOP HÍBRIDO (Tenta ler Código de Barras SSCC de longe + OCR de perto)
    async function loopLeituraHibrida() {
      if (!ocrAtivo || processandoHU) {
        setTimeout(loopLeituraHibrida, 400);
        return;
      }

      try {
        miraBox.classList.add('lendo');

        // TENTATIVA 1: Ler de Longe via Barcode GS1-128 (SSCC)
        try {
          const barcodeResult = await barcodeReader.decodeFromVideoElement(video);
          if (barcodeResult && barcodeResult.text) {
            // Limpa o resultado do código de barras tirando (00) do GS1
            const barcodeNum = barcodeResult.text.replace(/\D/g, '');
            const matchBarcode = barcodeNum.match(/1789\d{14}/); // Reconhece padrão SSCC iniciado em 1789
            
            if (matchBarcode) {
              const huBarcode = matchBarcode[0];
              numerosLidosEl.innerText = huBarcode;
              contadorDigitosEl.innerText = "18 / 18";
              dicaStatusEl.innerText = "🎯 SSCC Lido (De Longe)!";
              await verificarHU(huBarcode);
              setTimeout(loopLeituraHibrida, 400);
              return;
            }
          }
        } catch(e) {
          // Se não achou barcode no frame, segue para o OCR normalmente
        }

        // TENTATIVA 2: Ler via OCR de Perto
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        
        if (vw > 0 && vh > 0) {
          canvas.width = vw * 0.9;
          canvas.height = vh * 0.6;
          const ctx = canvas.getContext('2d');
          
          ctx.drawImage(video, vw * 0.05, vh * 0.20, vw * 0.9, vh * 0.6, 0, 0, canvas.width, canvas.height);

          const { data: { text } } = await workerOCR.recognize(canvas);
          const textoLimpo = text.replace(/\D/g, '');

          if (textoLimpo.length > 0) {
            // Procura o padrão que começa com 1789 e tem 18 dígitos
            const matchSSCC = textoLimpo.match(/1789\d{14}/);

            if (matchSSCC) {
              const huOCR = matchSSCC[0];
              numerosLidosEl.innerText = huOCR;
              contadorDigitosEl.innerText = "18 / 18";
              dicaStatusEl.innerText = "🎯 Padrão 1789... Detectado!";
              miraBox.classList.remove('lendo');
              miraBox.classList.add('sucesso');
              await verificarHU(huOCR);
            } else {
              // Exibe os números parciais sendo formados
              const exibeNum = textoLimpo.substring(0, 18);
              numerosLidosEl.innerText = exibeNum;
              contadorDigitosEl.innerText = `${exibeNum.length} / 18`;
              dicaStatusEl.innerText = "👁️ Buscando padrão 1789...";
              dicaStatusEl.style.color = "#ffd700";
            }
          } else {
            numerosLidosEl.innerText = "Aguardando...";
            contadorDigitosEl.innerText = "0 / 18";
          }
        }
        miraBox.classList.remove('lendo');
      } catch (e) {
        console.error(e);
      }

      setTimeout(loopLeituraHibrida, 300);
    }

    // Validar com o Sheets
    async function verificarHU(hu) {
      processandoHU = true;
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ hu: hu })
        });
        const data = await res.json();

        if (data.status === "sucesso") {
          tocarBip();
          const ping = document.getElementById('ping-overlay');
          document.getElementById('ping-hu').innerText = hu;
          ping.style.display = 'flex';
          
          atualizarDashboard();

          setTimeout(() => {
            ping.style.display = 'none';
            resetarVisor();
            processandoHU = false;
          }, 3000);

        } else if (data.status === "ja_lido") {
          dicaStatusEl.innerText = `⚠️ HU ${hu} JÁ FOI LIDA!`;
          dicaStatusEl.style.color = "#ff9800";
          setTimeout(() => { resetarVisor(); processandoHU = false; }, 2000);
        } else {
          dicaStatusEl.innerText = `❌ HU ${hu} não está na lista!`;
          dicaStatusEl.style.color = "#ff5252";
          setTimeout(() => { resetarVisor(); processandoHU = false; }, 2000);
        }
      } catch (e) {
        dicaStatusEl.innerText = "❌ Erro na resposta da Planilha.";
        dicaStatusEl.style.color = "#ff5252";
        setTimeout(() => { resetarVisor(); processandoHU = false; }, 2000);
      }
    }

    function resetarVisor() {
      miraBox.classList.remove('sucesso');
      numerosLidosEl.innerText = "Aguardando...";
      contadorDigitosEl.innerText = "0 / 18";
      dicaStatusEl.innerText = "🟢 Enquadre a etiqueta no visor";
      dicaStatusEl.style.color = "#00e676";
    }

    atualizarDashboard();
    setInterval(atualizarDashboard, 5000);
  </script>
</body>
</html>
