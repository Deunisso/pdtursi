<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WMS - Leitor de HU (OCR)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { width: 100%; height: 100vh; overflow: hidden; background: #0b0b10; color: #fff; }
    
    .app-container { display: flex; flex-direction: column; height: 100vh; padding: 8px; justify-content: space-between; }

    /* Topo: Painel Slim */
    #dashboard { display: flex; justify-content: space-between; gap: 8px; height: 60px; }
    .card { background: #161622; border-radius: 8px; flex: 1; padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-bottom: 3px solid #333; }
    .card.found { border-color: #00e676; }
    .card.missing { border-color: #ff5252; }
    .card p { font-size: 10px; color: #aaa; text-transform: uppercase; font-weight: bold; }
    .card h2 { font-size: 22px; margin-top: 2px; }
    .found h2 { color: #00e676; }
    .missing h2 { color: #ff5252; }

    /* Câmera Central */
    #video-container { position: relative; flex: 1; margin: 8px 0; border-radius: 12px; overflow: hidden; border: 2px solid #2a2a3a; background: #000; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* MIRA COM LEITURA DENTRO DO VISOR */
    .mira { position: absolute; top: 28%; left: 5%; width: 90%; height: 44%; border: 2px dashed #00d2ff; box-shadow: 0 0 0 999px rgba(0,0,0,0.65); border-radius: 8px; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; transition: all 0.25s ease; }
    .mira.lendo { border-color: #ffd700; }
    .mira.sucesso { border-color: #00e676; background: rgba(0, 230, 118, 0.15); box-shadow: 0 0 0 999px rgba(0,0,0,0.65), 0 0 25px #00e676; }

    /* Textos DENTRO do Visor */
    .visor-topo { display: flex; justify-content: space-between; font-size: 11px; color: #00d2ff; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
    .visor-numeros { font-family: 'Courier New', monospace; font-size: 20px; font-weight: 900; color: #00e676; text-align: center; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.9); background: rgba(0,0,0,0.75); padding: 8px; border-radius: 6px; word-break: break-all; margin: auto 0; }
    .visor-status { font-size: 11px; color: #ffd700; text-align: center; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.9); background: rgba(0,0,0,0.6); padding: 4px; border-radius: 4px; }

    /* NOTIFICAÇÃO DISCRETA NO TOPO (Substitui o overlay verde) */
    #notificacao-discreta { display: none; position: absolute; top: 12px; left: 5%; width: 90%; background: #12121a; border: 2px solid #00e676; border-radius: 8px; padding: 10px 15px; z-index: 100; box-shadow: 0 4px 15px rgba(0,230,118,0.4); text-align: left; animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    #notificacao-discreta .titulo { font-size: 12px; color: #00e676; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    #notificacao-discreta .hu-codigo { font-family: monospace; font-size: 18px; color: #fff; font-weight: bold; margin-top: 2px; letter-spacing: 1.5px; }

    @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    #canvas-processamento { display: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Topo Slim -->
    <div id="dashboard">
      <div class="card found">
        <p>Encontradas</p>
        <h2 id="qtd-encontradas">-</h2>
      </div>
      <div class="card missing">
        <p>Faltam</p>
        <h2 id="qtd-faltam">-</h2>
      </div>
    </div>

    <!-- Câmera com Visor Interno e Notificação Discreta -->
    <div id="video-container">
      <video id="webcam" autoplay playsinline></video>
      
      <!-- Notificação Discreta -->
      <div id="notificacao-discreta">
        <div class="titulo">✓ HU Registrada na Planilha</div>
        <div id="hu-notificacao-texto" class="hu-codigo">000000000000000000</div>
      </div>

      <!-- Mira com Visor HUD -->
      <div id="mira-box" class="mira">
        <div class="visor-topo">
          <span>PADRÃO HU (18 DÍGITOS)</span>
          <span id="contador-digitos">0 / 18</span>
        </div>
        <div id="numeros-lidos" class="visor-numeros">Aguardando...</div>
        <div id="dica-status" class="visor-status">Iniciando câmera...</div>
      </div>
    </div>
  </div>

  <canvas id="canvas-processamento"></canvas>

  <script>
    // =================================================================
    // ⚠️ COLOQUE AQUI A SUA URL DO GOOGLE APPS SCRIPT:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvKN1zlgTn2F-iY-CgqU9bcSuvBgRvtAMQGeMsa9psE2B7snJ6d8Ov1dCLbiL0YVWt_A/exec";
    // =================================================================

    const video = document.getElementById('webcam');
    const miraBox = document.getElementById('mira-box');
    const numerosLidosEl = document.getElementById('numeros-lidos');
    const contadorDigitosEl = document.getElementById('contador-digitos');
    const dicaStatusEl = document.getElementById('dica-status');
    const notificacaoEl = document.getElementById('notificacao-discreta');
    const huNotificacaoTexto = document.getElementById('hu-notificacao-texto');
    const canvas = document.getElementById('canvas-processamento');

    let ocrAtivo = false;
    let processandoHU = false;
    let workerOCR = null;

    // Bip Sonoro
    function tocarBip() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch(e) {}
    }

    // Dashboard
    async function atualizarDashboard() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        document.getElementById('qtd-encontradas').innerText = data.encontradas;
        document.getElementById('qtd-faltam').innerText = data.pendentes;
      } catch (e) {}
    }

    // Inicializar Câmera
    navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: "environment", 
        width: { ideal: 1920 }, 
        height: { ideal: 1080 },
        focusMode: "continuous"
      } 
    })
    .then(stream => {
      video.srcObject = stream;
      iniciarOCR();
    })
    .catch(err => {
      dicaStatusEl.innerText = "❌ Permita o acesso à câmera.";
      dicaStatusEl.style.color = "#ff5252";
    });

    async function iniciarOCR() {
      dicaStatusEl.innerText = "⚡ Carregando Filtros de Leitura...";
      
      workerOCR = await Tesseract.createWorker('eng');
      
      // Restrição estrita de caracteres numéricos
      await workerOCR.setParameters({
        tessedit_char_whitelist: '0123456789',
      });

      dicaStatusEl.innerText = "🟢 Alinhe os 18 dígitos na mira horizontal";
      dicaStatusEl.style.color = "#00e676";
      ocrAtivo = true;

      loopOCR();
    }

    // Loop com validação de Geometria Horizontal + Certeza Mínima
    async function loopOCR() {
      if (!ocrAtivo || processandoHU) {
        setTimeout(loopOCR, 250);
        return;
      }

      try {
        miraBox.classList.add('lendo');
        
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        
        if (vw > 0 && vh > 0) {
          canvas.width = vw * 0.9;
          canvas.height = vh * 0.44;
          const ctx = canvas.getContext('2d');
          
          ctx.drawImage(video, vw * 0.05, vh * 0.28, vw * 0.9, vh * 0.44, 0, 0, canvas.width, canvas.height);

          // TRATAMENTO DE IMAGEM SEVERO (Remove ruídos de fundo de longe)
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;
          for (let i = 0; i < data.length; i += 4) {
            let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
            // Limiar alto: só mantém pretos fortes (caracteres do SSCC)
            avg = avg < 110 ? 0 : 255;
            data[i] = avg;
            data[i + 1] = avg;
            data[i + 2] = avg;
          }
          ctx.putImageData(imgData, 0, 0);

          const result = await workerOCR.recognize(canvas);
          const symbols = result.data.symbols || [];
          
          // FILTRO GEOMÉTRICO: Seleciona apenas símbolos com boa confiança (>75%)
          const simbolosValidos = symbols.filter(s => s.confidence >= 75 && /\d/.test(s.text));
          
          // Agrupa caracteres por linha (tolerância de Y <= 15px) para garantir leitura lado a lado
          const linhas = {};
          simbolosValidos.forEach(s => {
            const yCentro = Math.round(s.bbox.y0 / 15) * 15;
            if (!linhas[yCentro]) linhas[yCentro] = [];
            linhas[yCentro].push(s);
          });

          let huEncontrada = null;
          let melhorParcial = "";

          // Analisa cada linha horizontal encontrada
          for (const key in linhas) {
            // Ordena os números da linha da esquerda para a direita (X)
            const linhaOrdenada = linhas[key].sort((a, b) => a.bbox.x0 - b.bbox.x0);
            const textoLinha = linhaOrdenada.map(s => s.text).join('');

            if (textoLinha.length > melhorParcial.length) {
              melhorParcial = textoLinha;
            }

            // Procura o padrão SSCC exato de 18 dígitos na linha horizontal
            const match = textoLinha.match(/1789\d{14}/) || textoLinha.match(/\d{18}/);
            if (match) {
              huEncontrada = match[0];
              break;
            }
          }

          if (huEncontrada) {
            numerosLidosEl.innerText = huEncontrada;
            contadorDigitosEl.innerText = "18 / 18";
            dicaStatusEl.innerText = "🎯 Leitura Alinhada Detectada!";
            dicaStatusEl.style.color = "#00e676";
            
            miraBox.classList.remove('lendo');
            miraBox.classList.add('sucesso');
            
            await verificarHU(huEncontrada);
          } else if (melhorParcial.length > 0) {
            const parcialExibida = melhorParcial.substring(0, 18);
            numerosLidosEl.innerText = parcialExibida;
            contadorDigitosEl.innerText = `${parcialExibida.length} / 18`;
            dicaStatusEl.innerText = "👁️ Alinhando dígitos horizontais...";
            dicaStatusEl.style.color = "#ffd700";
          } else {
            numerosLidosEl.innerText = "Aguardando...";
            contadorDigitosEl.innerText = "0 / 18";
          }
        }
        miraBox.classList.remove('lendo');
      } catch (e) {
        console.error(e);
      }

      setTimeout(loopOCR, 200);
    }

    // Enviar para a planilha e exibir alerta discreto
    async function verificarHU(hu) {
      processandoHU = true;
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ hu: hu })
        });
        const data = await res.json();

        if (data.status === "sucesso") {
          tocarBip();
          
          // NOTIFICAÇÃO DISCRETA NO TOPO
          huNotificacaoTexto.innerText = hu;
          notificacaoEl.style.display = 'block';
          
          atualizarDashboard();

          setTimeout(() => {
            notificacaoEl.style.display = 'none';
            resetarVisor();
            processandoHU = false;
          }, 2800);

        } else if (data.status === "ja_lido") {
          dicaStatusEl.innerText = `⚠️ HU ${hu} JÁ FOI LIDA!`;
          dicaStatusEl.style.color = "#ff9800";
          setTimeout(() => { resetarVisor(); processandoHU = false; }, 2000);
        } else {
          dicaStatusEl.innerText = `❌ HU ${hu} não pertence à lista!`;
          dicaStatusEl.style.color = "#ff5252";
          setTimeout(() => { resetarVisor(); processandoHU = false; }, 2000);
        }
      } catch (e) {
        dicaStatusEl.innerText = "❌ Erro ao conectar com a Planilha.";
        dicaStatusEl.style.color = "#ff5252";
        setTimeout(() => { resetarVisor(); processandoHU = false; }, 2000);
      }
    }

    function resetarVisor() {
      miraBox.classList.remove('sucesso');
      numerosLidosEl.innerText = "Aguardando...";
      contadorDigitosEl.innerText = "0 / 18";
      dicaStatusEl.innerText = "🟢 Alinhe os 18 dígitos na mira horizontal";
      dicaStatusEl.style.color = "#00e676";
    }

    atualizarDashboard();
    setInterval(atualizarDashboard, 5000);
  </script>
</body>
</html>
