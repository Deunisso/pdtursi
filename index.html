<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WMS - Leitor de HU (OCR)</title>
  <!-- Somente Tesseract.js para leitura ultra rápida -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { width: 100%; height: 100vh; overflow: hidden; background: #0b0b10; color: #fff; }
    
    /* Layout Container Fixo sem rolagem */
    .app-container { display: flex; flex-direction: column; height: 100vh; padding: 8px; justify-content: space-between; }

    /* Topo: Painel Slim */
    #dashboard { display: flex; justify-content: space-between; gap: 8px; height: 65px; }
    .card { background: #161622; border-radius: 8px; flex: 1; padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-bottom: 3px solid #333; }
    .card.found { border-color: #00e676; }
    .card.missing { border-color: #ff5252; }
    .card p { font-size: 10px; color: #aaa; text-transform: uppercase; font-weight: bold; }
    .card h2 { font-size: 24px; margin-top: 2px; }
    .found h2 { color: #00e676; }
    .missing h2 { color: #ff5252; }

    /* Câmera Central */
    #video-container { position: relative; flex: 1; margin: 8px 0; border-radius: 12px; overflow: hidden; border: 2px solid #2a2a3a; background: #000; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* MIRA COM LEITURA DENTRO DO VISOR */
    .mira { position: absolute; top: 25%; left: 5%; width: 90%; height: 50%; border: 2px dashed #00d2ff; box-shadow: 0 0 0 999px rgba(0,0,0,0.65); border-radius: 8px; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; transition: all 0.2s; }
    .mira.lendo { border-color: #ffd700; }
    .mira.sucesso { border-color: #00e676; background: rgba(0, 230, 118, 0.25); }

    /* Textos DENTRO do Visor */
    .visor-topo { display: flex; justify-content: space-between; font-size: 11px; color: #00d2ff; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
    .visor-numeros { font-family: 'Courier New', monospace; font-size: 20px; font-weight: 900; color: #00e676; text-align: center; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.9); background: rgba(0,0,0,0.7); padding: 8px; border-radius: 6px; word-break: break-all; margin: auto 0; }
    .visor-status { font-size: 11px; color: #ffd700; text-align: center; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.9); background: rgba(0,0,0,0.6); padding: 4px; border-radius: 4px; }

    /* Canvas Escondido para otimização de imagem */
    #canvas-processamento { display: none; }

    /* PING DE ALERTA EM TELA CHEIA */
    #ping-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 230, 118, 0.96); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; color: #000; animation: flash 0.2s; }
    #ping-overlay h1 { font-size: 32px; color: #000; margin: 0; font-weight: 900; }
    #ping-overlay p { font-size: 18px; margin: 8px 0; font-weight: bold; }
    #ping-hu { background: #000; color: #00e676; padding: 10px 18px; border-radius: 8px; font-size: 24px; font-family: monospace; letter-spacing: 2px; }
    @keyframes flash { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Topo Slim -->
    <div id="dashboard">
      <div class="card found">
        <p>Encontradas</p>
        <h2 id="qtd-encontradas">-</h2>
      </div>
      <div class="card missing">
        <p>Faltam</p>
        <h2 id="qtd-faltam">-</h2>
      </div>
    </div>

    <!-- Câmera com Visor Interno -->
    <div id="video-container">
      <video id="webcam" autoplay playsinline></video>
      
      <!-- Mira com Visor HUD -->
      <div id="mira-box" class="mira">
        <div class="visor-topo">
          <span>PADRÃO HU (18 DÍGITOS)</span>
          <span id="contador-digitos">0 / 18</span>
        </div>
        <div id="numeros-lidos" class="visor-numeros">Aguardando...</div>
        <div id="dica-status" class="visor-status">Iniciando câmera Full HD...</div>
      </div>
    </div>
  </div>

  <canvas id="canvas-processamento"></canvas>

  <!-- PING DE ALERTA -->
  <div id="ping-overlay">
    <h1>🚨 HU ENCONTRADA! 🚨</h1>
    <p>Baixa Registrada na Planilha!</p>
    <div id="ping-hu">000000000000000000</div>
  </div>

  <script>
    // =================================================================
    // ⚠️ COLOQUE AQUI A SUA URL DO GOOGLE APPS SCRIPT:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvKN1zlgTn2F-iY-CgqU9bcSuvBgRvtAMQGeMsa9psE2B7snJ6d8Ov1dCLbiL0YVWt_A/exec";
    // =================================================================

    const video = document.getElementById('webcam');
    const miraBox = document.getElementById('mira-box');
    const numerosLidosEl = document.getElementById('numeros-lidos');
    const contadorDigitosEl = document.getElementById('contador-digitos');
    const dicaStatusEl = document.getElementById('dica-status');
    const canvas = document.getElementById('canvas-processamento');

    let ocrAtivo = false;
    let processandoHU = false;
    let workerOCR = null;

    // Bip Sonoro
    function tocarBip() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch(e) {}
    }

    // Carregar Contadores da Planilha
    async function atualizarDashboard() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        document.getElementById('qtd-encontradas').innerText = data.encontradas;
        document.getElementById('qtd-faltam').innerText = data.pendentes;
      } catch (e) {}
    }

    // Inicializar Câmera em Alta Resolução
    navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: "environment", 
        width: { ideal: 1920 }, // Força Full HD para ler o texto grande de longe
        height: { ideal: 1080 },
        focusMode: "continuous"
      } 
    })
    .then(stream => {
      video.srcObject = stream;
      iniciarOCR();
    })
    .catch(err => {
      dicaStatusEl.innerText = "❌ Permita o acesso à câmera no celular.";
      dicaStatusEl.style.color = "#ff5252";
    });

    // Configurar o Motor OCR
    async function iniciarOCR() {
      dicaStatusEl.innerText = "⚡ Preparando Inteligência de Leitura...";
      
      workerOCR = await Tesseract.createWorker('eng');
      
      // Restringe o leitor exclusivamente a dígitos numéricos
      await workerOCR.setParameters({
        tessedit_char_whitelist: '0123456789',
      });

      dicaStatusEl.innerText = "🟢 Posicione os números do SSCC na mira";
      dicaStatusEl.style.color = "#00e676";
      ocrAtivo = true;

      loopOCR();
    }

    // Loop de Processamento OCR Continuo
    async function loopOCR() {
      if (!ocrAtivo || processandoHU) {
        setTimeout(loopOCR, 250);
        return;
      }

      try {
        miraBox.classList.add('lendo');
        
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        
        if (vw > 0 && vh > 0) {
          // Crop da área da mira
          canvas.width = vw * 0.9;
          canvas.height = vh * 0.5;
          const ctx = canvas.getContext('2d');
          
          ctx.drawImage(video, vw * 0.05, vh * 0.25, vw * 0.9, vh * 0.5, 0, 0, canvas.width, canvas.height);

          // Filtro de Nitidez / Binarização suave para destacar o texto de longe
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;
          for (let i = 0; i < data.length; i += 4) {
            let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
            // Limiar dinâmico para destacar os números pretos da etiqueta
            avg = avg < 140 ? 0 : 255;
            data[i] = avg;
            data[i + 1] = avg;
            data[i + 2] = avg;
          }
          ctx.putImageData(imgData, 0, 0);

          // Executa OCR no frame tratado
          const { data: { text } } = await workerOCR.recognize(canvas);
          const textoLimpo = text.replace(/\D/g, '');

          if (textoLimpo.length > 0) {
            // Procura exatamente a sequência de 18 dígitos que começa com 1789 (ou qualquer sequência de 18 dígitos)
            const matchSSCC = textoLimpo.match(/1789\d{14}/) || textoLimpo.match(/\d{18}/);

            if (matchSSCC) {
              const huDetectada = matchSSCC[0];
              numerosLidosEl.innerText = huDetectada;
              contadorDigitosEl.innerText = "18 / 18";
              dicaStatusEl.innerText = "🎯 18 Dígitos Detectados! Enviando...";
              dicaStatusEl.style.color = "#00e676";
              
              miraBox.classList.remove('lendo');
              miraBox.classList.add('sucesso');
              
              await verificarHU(huDetectada);
            } else {
              // Exibe a parcial na tela para você ver que ele está lendo os números grandes
              const parcial = textoLimpo.substring(0, 18);
              numerosLidosEl.innerText = parcial;
              contadorDigitosEl.innerText = `${parcial.length} / 18`;
              dicaStatusEl.innerText = "👁️ Montando código de 18 dígitos...";
              dicaStatusEl.style.color = "#ffd700";
            }
          } else {
            numerosLidosEl.innerText = "Aguardando...";
            contadorDigitosEl.innerText = "0 / 18";
          }
        }
        miraBox.classList.remove('lendo');
      } catch (e) {
        console.error(e);
      }

      setTimeout(loopOCR, 200);
    }

    // Validar com o Google Sheets
    async function verificarHU(hu) {
      processandoHU = true;
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ hu: hu })
        });
        const data = await res.json();

        if (data.status === "sucesso") {
          tocarBip();
          const ping = document.getElementById('ping-overlay');
          document.getElementById('ping-hu').innerText = hu;
          ping.style.display = 'flex';
          
          atualizarDashboard();

          setTimeout(() => {
            ping.style.display = 'none';
            resetarVisor();
            processandoHU = false;
          }, 3000);

        } else if (data.status === "ja_lido") {
          dicaStatusEl.innerText = `⚠️ HU ${hu} JÁ FOI LIDA!`;
          dicaStatusEl.style.color = "#ff9800";
          setTimeout(() => { resetarVisor(); processandoHU = false; }, 2000);
        } else {
          dicaStatusEl.innerText = `❌ HU ${hu} não está na lista!`;
          dicaStatusEl.style.color = "#ff5252";
          setTimeout(() => { resetarVisor(); processandoHU = false; }, 2000);
        }
      } catch (e) {
        dicaStatusEl.innerText = "❌ Erro ao conectar com a Planilha.";
        dicaStatusEl.style.color = "#ff5252";
        setTimeout(() => { resetarVisor(); processandoHU = false; }, 2000);
      }
    }

    function resetarVisor() {
      miraBox.classList.remove('sucesso');
      numerosLidosEl.innerText = "Aguardando...";
      contadorDigitosEl.innerText = "0 / 18";
      dicaStatusEl.innerText = "🟢 Posicione os números do SSCC na mira";
      dicaStatusEl.style.color = "#00e676";
    }

    atualizarDashboard();
    setInterval(atualizarDashboard, 5000);
  </script>
</body>
</html>
