<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PDTursi - Scanner WMS</title>
  
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Câmera Borda Vermelha -->
    <div id="video-container">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="canvas-processamento"></canvas>

      <div id="modo-leitura" class="status-escaneando">ESCANEANDO...</div>

      <div class="contador-box">
        <span id="contador-digitos">0 RESTANTES</span>
      </div>

      <div id="log-terminal" class="terminal-box oculto">
        <div class="terminal-header">STATUS DA CONEXÃO</div>
        <div id="log-mensagens" class="terminal-body"></div>
      </div>
    </div>

    <!-- 🔻 PAINEL INFERIOR COM CARDS ARRASTÁVEIS -->
    <div id="painel-pendentes">
      <div class="pendentes-header">
        <span>⌛ HUS PENDENTES (DESLIZE PARA O LADO ➔)</span>
      </div>
      <div id="container-lista-hus" class="lista-hus">
        <div class="hu-chip">Buscando HUs...</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
