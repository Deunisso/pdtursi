<script>
    const resultElement = document.getElementById('result');
    const historyList = document.getElementById('history-list');
    let html5QrcodeScanner;

    function onScanSuccess(decodedText) {
      // Bip e vibração ao ler (se o dispositivo suportar)
      if (navigator.vibrate) {
        navigator.vibrate(150);
      }

      // Tratamento do código (remove parênteses e espaços se houver no texto lido)
      const codigoLimpo = decodedText.replace(/[\(\)\s]/g, '');

      // Atualiza o resultado na tela
      resultElement.innerText = codigoLimpo;

      // Adiciona ao histórico na tela
      adicionarAoHistorico(codigoLimpo);

      // Pausa a câmera por 2 segundos para evitar leituras duplicadas seguidas
      html5QrcodeScanner.pause();
      setTimeout(() => {
        html5QrcodeScanner.resume();
      }, 2000);
    }

    function adicionarAoHistorico(codigo) {
      const hora = new Date().toLocaleTimeString();
      const li = document.createElement('li');
      li.className = 'history-item';
      li.innerHTML = `<span><strong>${codigo}</strong></span> <span class="history-time">${hora}</span>`;
      historyList.prepend(li);
    }

    // --- AJUSTE PARA CÂMERA TRASEIRA ---
    function inicializarLeitor() {
      // Configurações básicas do leitor
      const config = {
        fps: 15,
        qrbox: { width: 320, height: 160 }, // Retângulo ideal para códigos de barra (GS1-128/HU)
        aspectRatio: 1.0,
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true // Usa API nativa se disponível
        }
      };

      html5QrcodeScanner = new Html5QrcodeScanner("reader", config, /* verbose= */ false);

      // Inicializa preferindo a câmera traseira
      html5QrcodeScanner.render(onScanSuccess, () => {});
      
      // Força a preferência de ambiente (traseira) após a renderização inicial
      // Isso ajuda a garantir em dispositivos com múltiplas câmeras
      Html5Qrcode.getCameras().then(cameras => {
        if (cameras && cameras.length > 0) {
          // Se houver câmeras, tentamos garantir o facingMode correto
          // A configuração acima (config) já deveria fazer isso, mas
          // em alguns navegadores é necessário reforçar.
        }
      }).catch(err => {
        console.error("Erro ao listar câmeras:", err);
      });
    }

    // Inicialização ao carregar a página
    window.addEventListener('DOMContentLoaded', inicializarLeitor);
  </script>
